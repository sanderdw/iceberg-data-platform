[project]
name = "iceberg-platform-portal"
version = "0.5.0"
description = "Team-based Apache Iceberg administration and shared team marimo workspaces"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.53.0",
  "httpx>=0.28.1",
  "boto3>=1.43.98",
  "python-dotenv>=1.2.3",
  "psycopg[binary]>=3.3.6,<4",
]

[dependency-groups]
oidc = ["Authlib==1.8.0", "httpx2>=2.13.0"]
dev = [{include-group = "users"}, {include-group = "oidc"}, "pytest>=9.1.1", "ruff>=0.16.8", "httpx2>=2.13.0"]
data = ["pyiceberg[pyarrow,duckdb]>=0.12.0", "pandas>=3.0.6", "ipykernel>=7.3.0", "matplotlib>=3.11.2"]
users = [
    "sqlglot==30.18.0",
    "docker==7.2.0",
    "duckdb==1.5.5",
]
notebook = [
    "altair>=6.3.0",
    "duckdb==1.5.5",
    "marimo[sql]==0.24.2",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyiceberg[duckdb,pyarrow]>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint.per-file-ignores]
"server/app.py" = ["BLE001"] # Never return provider error bodies or secrets.
"server/polaris.py" = ["BLE001"] # Run every compensating action, even after one fails.
"user_portal/app.py" = ["BLE001"] # Sanitize gateway errors; notebook/user credentials stay server-side.
