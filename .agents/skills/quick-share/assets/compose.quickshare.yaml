# Temporary public HTTPS addresses through Cloudflare quick tunnels. Each tunnel gets a
# random trycloudflare.com address with a trusted certificate; nothing listens on the host.
# The gateway routes each address to the right services (see Caddyfile).
name: iceberg-quickshare
services:
  admin-tunnel:
    image: cloudflare/cloudflared:latest
    # A restarted tunnel gets a new address, which breaks sign-in until the switch is rerun.
    restart: "no"
    command: tunnel --url http://gateway:8080
    depends_on:
      - gateway
    networks:
      - platform
  users-tunnel:
    image: cloudflare/cloudflared:latest
    restart: "no"
    command: tunnel --url http://gateway:8081
    depends_on:
      - gateway
    networks:
      - platform
  gateway:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - platform
networks:
  platform:
    external: true
    name: iceberg-platform_default
