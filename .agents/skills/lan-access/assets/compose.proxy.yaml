# HTTPS entry point for other devices on the network. The platform containers keep
# their 127.0.0.1 bindings; only this proxy listens on the LAN address.
name: iceberg-proxy
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LAN_IP: "${PORTAL_LAN_IP:?Set PORTAL_LAN_IP to your host LAN address}"
    ports:
      - "${PORTAL_LAN_IP}:${PORT:-3000}:3000"
      - "${PORTAL_LAN_IP}:${USER_PORT:-3002}:3002"
      - "${PORTAL_LAN_IP}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - platform
networks:
  platform:
    external: true
    name: iceberg-platform_default
volumes:
  caddy-data:
  caddy-config:
