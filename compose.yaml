name: iceberg-platform

x-polaris-env: &polaris-env
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
  QUARKUS_DATASOURCE_USERNAME: polaris
  QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run uv run python -m scripts.setup first}
  POLARIS_REALM_CONTEXT_REALMS: POLARIS
  QUARKUS_OTEL_SDK_DISABLED: "true"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U polaris -d polaris"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-${PORTAL_PASSWORD}}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    environment: *polaris-env
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}"]
    depends_on:
      postgres:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  polaris:
    image: apache/polaris:1.7.0
    networks:
      default:
        aliases:
        - polaris-control-plane
    environment:
      <<: *polaris-env
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      POLARIS_AUTHENTICATION_TYPE: mixed
      QUARKUS_OIDC_TENANT_ENABLED: 'true'
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/iceberg
      QUARKUS_OIDC_CLIENT_ID: polaris
      QUARKUS_OIDC_TOKEN_ISSUER: ${OIDC_ISSUER}
      QUARKUS_OIDC_TOKEN_AUDIENCE: polaris
      QUARKUS_OIDC_JWKS_PATH: http://keycloak:8080/realms/iceberg/protocol/openid-connect/certs
      QUARKUS_OIDC_DISCOVERY_ENABLED: 'false'
      QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH: polaris/roles
      POLARIS_OIDC_PRINCIPAL_MAPPER_ID_CLAIM_PATH: polaris/principal_id
      POLARIS_OIDC_PRINCIPAL_MAPPER_NAME_CLAIM_PATH: polaris/principal_name
    ports:
      - "127.0.0.1:8181:8181"
    depends_on:
      keycloak:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  portal:
    build: .
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?Run scripts.setup first}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/iceberg
      OIDC_CLIENT_ID: iceberg-admin
      OIDC_CLIENT_SECRET: ${OIDC_PORTAL_SECRET}
      OIDC_MANAGEMENT_SECRET: ${OIDC_MANAGEMENT_SECRET:?Run scripts.setup first}
      OIDC_ORIGIN: ${PORTAL_ORIGIN}
      HOST: 0.0.0.0
      MONITOR_URL: http://monitor:3003
      PORTAL_PASSWORD: ${PORTAL_PASSWORD}
      PROVIDER: polaris
      POLARIS_URL: http://polaris:8181
      POLARIS_PUBLIC_URL: ${POLARIS_PUBLIC_URL:-http://localhost:8181}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_ADMIN_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
      polaris:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  monitor:
    build: .
    user: "0:0"
    command: ["/app/.venv/bin/uvicorn", "server.monitoring:create_monitor_app", "--factory", "--host", "0.0.0.0", "--port", "3003"]
    environment:
      PORTAL_PASSWORD: ${PORTAL_PASSWORD}
      POLARIS_URL: http://polaris:8181
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ADMIN_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MONITOR_PROJECTS: ${MONITOR_PROJECTS:-iceberg-platform,iceberg-workspaces}
      MONITOR_USERS_URL: ${MONITOR_USERS_URL:-http://users:3002}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - rustfs-data:/storage:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command:
    - start-dev
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts.setup
        first}
      KC_HOSTNAME: ${KEYCLOAK_ORIGIN}
      KC_HEALTH_ENABLED: 'true'
      OIDC_PORTAL_SECRET: ${OIDC_PORTAL_SECRET}
      OIDC_USERS_SECRET: ${OIDC_USERS_SECRET}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
    ports:
    - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    volumes:
    - keycloak-data:/opt/keycloak/data
    - type: bind
      source: ${KEYCLOAK_IMPORT_FILE:?Run scripts.setup first}
      target: /opt/keycloak/data/import/iceberg-realm.json
      read_only: true
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf ''GET /health/ready HTTP/1.0\r\n\r\n''
        >&3; cat <&3 | grep -q ''"status": "UP"'''
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
  keycloak-bootstrap:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORTAL_PASSWORD: ${PORTAL_PASSWORD}
      PROVIDER: polaris
      POLARIS_URL: http://polaris:8181
      POLARIS_PUBLIC_URL: ${POLARIS_PUBLIC_URL:-http://localhost:8181}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_ADMIN_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/iceberg
      OIDC_CLIENT_ID: iceberg-admin
      OIDC_CLIENT_SECRET: ${OIDC_PORTAL_SECRET}
      OIDC_MANAGEMENT_SECRET: ${OIDC_MANAGEMENT_SECRET}
      OIDC_ORIGIN: ${PORTAL_ORIGIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-platform-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_WRITER_PASSWORD: ${DEMO_WRITER_PASSWORD:-}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-}
      DEMO_OUTSIDER_PASSWORD: ${DEMO_OUTSIDER_PASSWORD:-}
    entrypoint:
    - /app/.venv/bin/python
    - -m
    - server.keycloak_bootstrap
    command: []
    depends_on:
      keycloak:
        condition: service_healthy
      polaris:
        condition: service_healthy

volumes:
  postgres18-data:
  pgadmin-data:
  rustfs-data:
  keycloak-data:
