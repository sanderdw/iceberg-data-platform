  "components": {
    "schemas": {
      "BranchInput": {
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 100,
            "title": "Name"
          },
          "source": {
            "type": "string",
            "maxLength": 100,
            "title": "Source",
            "default": "main"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "name"
        ],
        "title": "BranchInput"
      },
      "CommitInput": {
        "properties": {
          "branch": {
            "type": "string",
            "maxLength": 100,
            "title": "Branch"
          },
          "files": {
            "additionalProperties": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            },
            "type": "object",
            "title": "Files",
            "description": "Path \u2192 new content, or null to delete the file."
          },
          "message": {
            "type": "string",
            "maxLength": 2000,
            "title": "Message"
          },
          "expected_revision": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 40
              },
              {
                "type": "null"
              }
            ],
            "title": "Expected Revision",
            "description": "Fail if the branch moved since this revision."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "branch",
          "files",
          "message"
        ],
        "title": "CommitInput"
      },
      "CompileInput": {
        "properties": {
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment",
            "default": "development"
          },
          "ref": {
            "type": "string",
            "maxLength": 100,
            "title": "Ref",
            "default": "main"
          },
          "select": {
            "type": "string",
            "maxLength": 500,
            "title": "Select",
            "default": ""
          },
          "sql": {
            "type": "string",
            "maxLength": 20000,
            "title": "Sql",
            "description": "Inline SQL to compile instead of selected models.",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "CompileInput"
      },
      "DeleteInput": {
        "properties": {
          "confirm_name": {
            "type": "string",
            "maxLength": 48,
            "title": "Confirm Name"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "confirm_name"
        ],
        "title": "DeleteInput"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "MergeInput": {
        "properties": {
          "branch": {
            "type": "string",
            "maxLength": 100,
            "title": "Branch"
          },
          "message": {
            "type": "string",
            "maxLength": 2000,
            "title": "Message",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "branch"
        ],
        "title": "MergeInput"
      },
      "PreviewInput": {
        "properties": {
          "model": {
            "type": "string",
            "maxLength": 200,
            "title": "Model"
          },
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment",
            "default": "development"
          },
          "ref": {
            "type": "string",
            "maxLength": 100,
            "title": "Ref",
            "default": "main"
          },
          "limit": {
            "type": "integer",
            "maximum": 100.0,
            "minimum": 1.0,
            "title": "Limit",
            "default": 20
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "model"
        ],
        "title": "PreviewInput"
      },
      "ProjectInput": {
        "properties": {
          "team": {
            "type": "string",
            "pattern": "^team-[a-f0-9]{32}$",
            "title": "Team"
          },
          "name": {
            "type": "string",
            "title": "Name",
            "description": "3\u201348 lowercase letters, digits or '_', starting with a letter."
          },
          "description": {
            "type": "string",
            "maxLength": 280,
            "title": "Description",
            "default": ""
          },
          "default_database": {
            "type": "string",
            "maxLength": 48,
            "title": "Default Database",
            "description": "Display name of the team database models land in by default.",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "team",
          "name"
        ],
        "title": "ProjectInput"
      },
      "RunInput": {
        "properties": {
          "command": {
            "type": "string",
            "enum": [
              "build",
              "run",
              "seed",
              "test",
              "compile",
              "parse",
              "docs"
            ],
            "title": "Command",
            "default": "build"
          },
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment",
            "default": "development"
          },
          "ref": {
            "type": "string",
            "maxLength": 100,
            "title": "Ref",
            "default": "main"
          },
          "select": {
            "type": "string",
            "maxLength": 500,
            "title": "Select",
            "default": ""
          },
          "full_refresh": {
            "type": "boolean",
            "title": "Full Refresh",
            "default": false
          },
          "wait": {
            "type": "integer",
            "maximum": 600.0,
            "minimum": 0.0,
            "title": "Wait",
            "description": "Seconds to wait for the run to finish.",
            "default": 0
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "RunInput"
      },
      "ScheduleInput": {
        "properties": {
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment"
          },
          "cron": {
            "type": "string",
            "maxLength": 100,
            "title": "Cron",
            "description": "Five-field cron expression in UTC."
          },
          "command": {
            "type": "string",
            "enum": [
              "build",
              "run",
              "seed",
              "test"
            ],
            "title": "Command",
            "default": "build"
          },
          "select": {
            "type": "string",
            "maxLength": 500,
            "title": "Select",
            "default": ""
          },
          "ref": {
            "type": "string",
            "maxLength": 100,
            "title": "Ref",
            "default": "main"
          },
          "enabled": {
            "type": "boolean",
            "title": "Enabled",
            "default": true
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "environment",
          "cron"
        ],
        "title": "ScheduleInput"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
