# Local demonstration contract; this file is not part of the Ossie specification.
name: Synthetic flight operations
version: 1.0.0
owner: Active team in Iceberg Data Platform
purpose: Explain how semantics, quality evidence and governed access support AI-ready data products.
classification: Public synthetic demonstration data; no passenger or personal data.
refresh: Manually regenerated by notebook 06; no live feed or freshness SLA.
grain: One row in FLIGHT per scheduled flight instance, uniquely identified by id.
time_convention: All TIMESTAMP values represent UTC; date is the UTC scheduled departure date.
synthetic: true
minimum_flights: 10000
default_flights: 12000
ontology:
  file: flights.yaml
  project: https://github.com/apache/ossie
  source: https://raw.githubusercontent.com/apache/ossie/refs/heads/main/examples/flights.yaml
  commit: 6d37d7b61183f6405e3a4e65ec883b10ebe0ce2c
  scope: >-
    All six mapped datasets and their mapped fields are generated. Coordinates,
    schedules, aircraft and airline names are fictional. The SQL generator is a
    hand-written implementation of this example, not an Ossie runtime or a general
    ontology compiler. Unmapped telemetry series and cancellation descriptions
    are not populated. Ontology requirements are checked only where listed below.
binding:
  catalog: lakehouse
  namespace: [ai_flights]
  source_resolution: DATABASE.SCHEMA in flights.yaml resolves to the attached catalog and notebook NAMESPACE.
units:
  delays: minutes; negative means early
  durations: minutes; duration includes taxi, air_time excludes taxi
  distance: miles; route distance is planned, flight distance is synthetic actual distance
  runway_length: feet
  aircraft_capacity: pounds
  coordinates: latitude/longitude degrees; runway shape is a JSON list of latitude/longitude pairs
null_policy: >-
  Canceled flights have NULL actual times, delays, durations and distance; they are
  not zero-delay flights. Diverted flights have actual landing times but no modeled
  alternate airport. Exclude diverted flights when measuring arrival punctuality
  at the planned destination.
cancellation_codes:
  A: Carrier
  B: Weather
  C: National air system
  D: Security
# What each mapped field means, for the stored semantic model. A `label` names the concept in
# flights.yaml that the field holds, so catalogs can group fields by business meaning. Synonyms
# and examples become the field's Ossie `ai_context`; `instructions` the dataset's.
datasets:
  FLIGHT:
    instructions: >-
      One row per scheduled flight instance. Exclude diverted flights when measuring arrival
      punctuality at the planned destination.
    fields:
      id: {label: FlightId, description: Unique identifier of one scheduled flight instance.}
      nr: {label: FlightNr, description: "IATA flight number: the carrier code followed by a number.", synonyms: [flight number], examples: [XA101]}
      carrier_code: {label: CarrierCode, description: Two-letter IATA code of the operating carrier; joins CARRIER.code., synonyms: [airline]}
      route_id: {label: RouteId, description: The route flown; joins ROUTE.id.}
      tail_nr: {label: TailNr, description: Tail number of the aircraft that flew; joins AIRCRAFT.tail_nr.}
      date: {description: UTC date of the scheduled departure., synonyms: [flight date]}
      scheduled_departure: {description: Scheduled departure from the gate in UTC.}
      scheduled_arrival: {description: Scheduled arrival at the gate in UTC.}
      scheduled_duration: {label: NrMinutes, description: Scheduled gate-to-gate time in minutes.}
      departure: {description: Actual departure from the gate in UTC; NULL when canceled.}
      arrival: {description: Actual arrival at the gate in UTC; NULL when canceled.}
      dep_delay: {label: Delay, description: "Departure delay in minutes; negative means early, NULL when canceled.", synonyms: [departure delay]}
      arr_delay: {label: Delay, description: "Arrival delay in minutes; negative means early, NULL when canceled.", synonyms: [arrival delay]}
      wheels_off: {description: Takeoff time in UTC; NULL when canceled.}
      wheels_on: {description: Landing time in UTC; NULL when canceled.}
      duration: {label: NrMinutes, description: "Actual gate-to-gate time in minutes, including taxi; NULL when canceled."}
      air_time: {label: NrMinutes, description: "Time in the air in minutes, excluding taxi; NULL when canceled."}
      distance: {label: Distance, description: Actual distance flown in miles; NULL when canceled.}
      cancelled: {description: True when the flight was canceled., synonyms: [canceled]}
      diverted: {description: True when the flight landed somewhere other than its planned destination.}
      cancel_code: {label: CancelationCode, description: "Reason for a cancellation: A carrier, B weather, C national air system, D security; NULL when not canceled.", examples: [A, B, C, D]}
  CARRIER:
    fields:
      code: {label: CarrierCode, description: Two-letter IATA code of the airline., examples: [XA]}
      name: {label: CarrierName, description: Name of the airline., synonyms: [airline]}
  AIRCRAFT:
    fields:
      serial_nr: {label: SerialNr, description: Serial number from the manufacturer.}
      name: {description: Name of the aircraft.}
      nr_seats: {description: Number of passenger seats.}
      tail_nr: {label: TailNr, description: Tail number that identifies the aircraft., synonyms: [registration]}
      carrier_code: {label: CarrierCode, description: Carrier that operates the aircraft; joins CARRIER.code.}
      manufacturer: {label: ManufacturerName, description: Manufacturer of the aircraft.}
      model: {label: ModelName, description: Model of the aircraft.}
      year: {label: Year, description: Year the aircraft was manufactured.}
      capacity: {label: Capacity, description: Capacity of the aircraft in pounds.}
  AIRPORT:
    fields:
      code: {label: AirportCode, description: Three-letter IATA code of the airport., examples: [QAA]}
      name: {label: AirportName, description: Name of the airport.}
      city_nm: {label: CityName, description: City the airport is in.}
      state_code: {label: StateCode, description: Two-letter code of the US state the airport is in.}
      state_nm: {label: StateName, description: Name of the US state the airport is in.}
      market_nm: {label: MarketName, description: Market the airport serves.}
      latitude: {label: DegreesLatitude, description: Latitude of the airport in degrees.}
      longitude: {label: DegreesLongitude, description: Longitude of the airport in degrees.}
      opened: {description: Date the airport opened.}
  ROUTE:
    fields:
      id: {label: RouteId, description: The departure and destination airport codes joined by an arrow., examples: [QAA -> QAB]}
      name: {description: The departure and destination airport names.}
      orig_airport_code: {label: AirportCode, description: Departure airport; joins AIRPORT.code., synonyms: [origin]}
      dest_airport_code: {label: AirportCode, description: Destination airport; joins AIRPORT.code., synonyms: [destination]}
      distance: {label: Distance, description: Planned distance between the two airports in miles.}
      dist_grp: {label: DistanceGroup, description: "Distance group from 1 (shortest) to 10 (longest), in steps of 300 miles."}
  RUNWAY:
    instructions: >-
      Airports have several runways: never join RUNWAY into a flight aggregate without
      accounting for that.
    fields:
      airport_code: {label: AirportCode, description: Airport the runway belongs to; joins AIRPORT.code.}
      designator: {label: RunwayDesignator, description: "Designator of the runway, unique within its airport.", examples: [09/27]}
      length: {label: RunwayLength, description: Length of the runway in feet.}
      shape: {label: RunwayGeometry, description: Outline of the runway as a JSON list of latitude and longitude pairs.}
metrics:
  average_departure_delay:
    description: Ossie Airport.average_departure_delay and Route.average_departure_delay; AVG ignores NULL.
    sql: avg(f.dep_delay)
    unit: minutes
  average_arrival_delay:
    description: Ossie Route.average_arrival_delay; includes observed diverted flights, ignores NULL.
    sql: avg(f.arr_delay)
    unit: minutes
  on_time_arrival_pct:
    description: Demo policy, not an Ossie definition. Arrival delay < 15 minutes among noncanceled, nondiverted flights.
    sql: 100.0 * count(*) FILTER (WHERE NOT f.cancelled AND NOT f.diverted AND f.arr_delay < 15) / nullif(count(*) FILTER (WHERE NOT f.cancelled AND NOT f.diverted), 0)
    unit: percent
  cancellation_pct:
    description: Canceled flights divided by all scheduled flight instances.
    sql: 100.0 * count(*) FILTER (WHERE f.cancelled) / nullif(count(*), 0)
    unit: percent
ai_guidance:
  - Resolve business terms through the ontology and mappings before choosing SQL columns.
  - Join FLIGHT.route_id to ROUTE.id, then use orig_airport_code for departure and dest_airport_code for destination.
  - Join FLIGHT.carrier_code to CARRIER.code and FLIGHT.tail_nr to AIRCRAFT.tail_nr; each dimension key must be unique.
  - Never join RUNWAY into a flight aggregate without accounting for multiple runways per airport.
  - State the metric definition, denominator, units, time window and exclusions with every answer.
  - Treat results as synthetic demonstrations, not evidence about real airlines or airports.
  - Semantics provide context; they do not guarantee correct AI answers or replace access controls.
quality_checks:
  - name: At least 10000 flight instances
    sql: SELECT CASE WHEN count(*) >= 10000 THEN 0 ELSE 1 END FROM FLIGHT
  - name: Unique non-null entity keys
    sql: >-
      SELECT (SELECT count(*) - count(DISTINCT id) FROM FLIGHT)
           + (SELECT count(*) - count(DISTINCT id) FROM ROUTE)
           + (SELECT count(*) - count(DISTINCT code) FROM AIRPORT)
           + (SELECT count(*) - count(DISTINCT code) FROM CARRIER)
           + (SELECT count(*) - count(DISTINCT tail_nr) FROM AIRCRAFT)
           + (SELECT count(*) - count(DISTINCT (airport_code, designator)) FROM RUNWAY)
           + (SELECT count(*) FROM RUNWAY WHERE airport_code IS NULL OR designator IS NULL)
  - name: Required airports and carriers exist
    sql: SELECT CASE WHEN (SELECT count(*) FROM AIRPORT) > 0 AND (SELECT count(*) FROM CARRIER) > 0 THEN 0 ELSE 1 END
  - name: Flight references resolve and aircraft belongs to operating carrier
    sql: >-
      SELECT count(*) FROM FLIGHT f
      LEFT JOIN ROUTE r ON f.route_id = r.id
      LEFT JOIN CARRIER c ON f.carrier_code = c.code
      LEFT JOIN AIRCRAFT a ON f.tail_nr = a.tail_nr
      WHERE r.id IS NULL OR c.code IS NULL OR a.tail_nr IS NULL OR a.carrier_code IS DISTINCT FROM f.carrier_code
  - name: Supporting references resolve
    sql: >-
      SELECT (SELECT count(*) FROM ROUTE r
              LEFT JOIN AIRPORT o ON r.orig_airport_code = o.code
              LEFT JOIN AIRPORT d ON r.dest_airport_code = d.code
              WHERE o.code IS NULL OR d.code IS NULL)
           + (SELECT count(*) FROM RUNWAY r LEFT JOIN AIRPORT a ON r.airport_code = a.code WHERE a.code IS NULL)
           + (SELECT count(*) FROM AIRCRAFT a LEFT JOIN CARRIER c ON a.carrier_code = c.code WHERE c.code IS NULL)
  - name: Route endpoints differ and distances and groups are valid
    sql: SELECT count(*) FROM ROUTE WHERE orig_airport_code = dest_airport_code OR distance IS NULL OR distance <= 0 OR dist_grp IS NULL OR dist_grp NOT BETWEEN 1 AND 10
  - name: Required airport coordinates are in range
    sql: SELECT count(*) FROM AIRPORT WHERE latitude IS NULL OR longitude IS NULL OR latitude NOT BETWEEN -90 AND 90 OR longitude NOT BETWEEN -180 AND 180
  - name: Scheduled times and UTC dates are consistent
    sql: SELECT count(*) FROM FLIGHT WHERE scheduled_departure IS NULL OR scheduled_arrival IS NULL OR scheduled_departure >= scheduled_arrival OR date IS DISTINCT FROM scheduled_departure::DATE OR scheduled_duration IS DISTINCT FROM date_diff('minute', scheduled_departure, scheduled_arrival)
  - name: Cancellation codes and missing actual observations agree
    sql: >-
      SELECT count(*) FROM FLIGHT WHERE cancelled IS NULL OR diverted IS NULL
      OR (cancelled AND (cancel_code IS NULL OR cancel_code NOT IN ('A', 'B', 'C', 'D') OR diverted
          OR departure IS NOT NULL OR arrival IS NOT NULL OR dep_delay IS NOT NULL OR arr_delay IS NOT NULL
          OR wheels_off IS NOT NULL OR wheels_on IS NOT NULL OR duration IS NOT NULL OR air_time IS NOT NULL OR distance IS NOT NULL))
      OR (NOT cancelled AND (cancel_code IS NOT NULL OR departure IS NULL OR arrival IS NULL
          OR dep_delay IS NULL OR arr_delay IS NULL OR wheels_off IS NULL OR wheels_on IS NULL
          OR duration IS NULL OR air_time IS NULL OR distance IS NULL))
  - name: Actual timestamps agree with delays and durations
    sql: >-
      SELECT count(*) FROM FLIGHT WHERE NOT cancelled AND (
        NOT (departure < wheels_off AND wheels_off < wheels_on AND wheels_on < arrival)
        OR dep_delay IS DISTINCT FROM date_diff('minute', scheduled_departure, departure)
        OR arr_delay IS DISTINCT FROM date_diff('minute', scheduled_arrival, arrival)
        OR duration IS DISTINCT FROM date_diff('minute', departure, arrival)
        OR air_time IS DISTINCT FROM date_diff('minute', wheels_off, wheels_on) OR distance <= 0)
  - name: Every dataset is explicitly synthetic
    sql: >-
      SELECT (SELECT count(*) FROM FLIGHT WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM AIRPORT WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM CARRIER WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM AIRCRAFT WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM ROUTE WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM RUNWAY WHERE synthetic IS DISTINCT FROM true)
