# Local demonstration contract for notebooks 09 and 10. It is the only source of this product's
# meaning: notebook 09 builds the tables, their column docs, the quality checks and the semantic
# model from it. Field labels must name one of the concepts below; catalogs show them as tags.
name: MV load forecast
version: 1.0.0
description: >-
  Synthetic medium-voltage (MV, 20 kV and lower) load forecast and congestion outlook per grid
  asset, for distribution network architects who decide where the grid needs investment.
owner: Active team in Iceberg Data Platform
purpose: >-
  Show how a forecast product carries meaning, quality evidence and governed access, so people
  and AI agents can find congestion and explain what drives it.
classification: Public synthetic demonstration data; fictional substations, assets and customers; no personal data.
refresh: Manually regenerated by notebook 09; no live feed or freshness SLA.
grain: >-
  One row in LOAD_FORECAST per asset, forecast year and direction (offtake or feed-in); one row in
  CONGESTION per asset and direction.
time_convention: >-
  year is a calendar year from 2026 to 2040 and each forecast row is that year's expected peak.
  2025 is the reference year of the baseline. The product has no timestamps.
horizon:
  reference_year: 2025
  first_year: 2026
  last_year: 2040
congestion_threshold_pct: 100
severity_classes:
  none: peak utilization below 100 percent
  moderate: 100 to below 120 percent
  high: 120 to below 150 percent
  critical: 150 percent or more
units:
  power: MW; transformer ratings in MVA are treated as MW (power factor 1)
  utilization: percent of the asset's rated_mw
  voltage: kV
  coordinates: WGS84 latitude and longitude in degrees
null_policy: >-
  CONGESTION.first_congestion_year is NULL when an asset stays below the threshold in the whole
  horizon. Connected customers have contracted capacity and NULL requested capacity and
  planned_year; future customers have the reverse. NULL never means zero.
scope: >-
  The baseline forecast only. Each asset's peak is computed on its own, so peaks of different
  assets are not coincident. Experts who disagree with the forecast adjust spreading models in
  their investment proposals; those adjustments, the LV and HV grids and reinforcement plans are
  out of scope.
binding:
  catalog: lakehouse
  namespace: [ai_grid_forecast]
concepts:
  Substation: A primary substation that transforms high voltage to MV and supplies one service area.
  ServiceArea: The area a primary substation supplies.
  Region: A planning region that groups substations.
  Feeder: An outgoing MV circuit of a primary substation.
  Voltage: The nominal voltage of an MV circuit.
  Asset: A grid component with a rated capacity, such as a cable section, transformer or MV room.
  AssetType: The kind of grid component.
  RatedCapacity: The power an asset may carry continuously.
  CommissioningYear: The year an asset went into service.
  Latitude: WGS84 latitude.
  Longitude: WGS84 longitude.
  ForecastYear: A calendar year in the forecast horizon.
  Direction: Offtake (power drawn from the grid) or feed-in (power fed into the grid).
  BaselineLoad: The peak of the reference year, before growth.
  SpreadingLoad: Peak growth that spreading models assign to an asset.
  CustomerLoad: Peak load of large customers connected to an asset.
  PeakLoad: The expected yearly peak of an asset.
  Utilization: Peak load as a percentage of rated capacity.
  SpreadingModel: A model that distributes national growth of a technology over the grid.
  Technology: The technology a spreading model distributes.
  Contribution: The part of a peak that one spreading model adds.
  LargeCustomer: A business with its own MV connection.
  Sector: The business activity of a large customer.
  CustomerStatus: Whether a large customer is connected or still to come.
  ContractedCapacity: Transport capacity in a signed connection agreement.
  RequestedCapacity: Transport capacity a future customer asked for.
  PlannedYear: The year a future customer wants to start.
  CongestionYear: The first year an asset's peak reaches its rated capacity.
  CongestionSeverity: How far the highest peak exceeds the rated capacity.
  Overload: Power above the rated capacity.
  Name: A display name.
# Every dataset becomes one Iceberg table with these columns, in this order, plus `synthetic`.
# A field's description is also its Iceberg column doc. `dimension` is true for fields people group
# and filter by, or `time` for the time dimension; synonyms and examples become its Ossie ai_context.
datasets:
  SUBSTATION:
    table: substation
    description: Primary substations (HV/MV) of the example grid and the service area each one supplies.
    primary_key: [substation_id]
    fields:
      substation_id:
        type: string
        label: Substation
        dimension: true
        description: Substation code, such as SS-ALD.
        examples: [SS-ALD, SS-CED]
      name:
        type: string
        label: Name
        dimension: true
        description: Substation name.
        synonyms: [primary substation, main substation]
      service_area:
        type: string
        label: ServiceArea
        dimension: true
        description: The area this substation supplies.
        synonyms: [supply area, catchment area]
      region:
        type: string
        label: Region
        dimension: true
        description: Planning region of the substation.
        examples: [North, East, South]
      latitude:
        type: double
        label: Latitude
        description: Substation latitude in WGS84 degrees.
      longitude:
        type: double
        label: Longitude
        description: Substation longitude in WGS84 degrees.
  FEEDER:
    table: feeder
    description: Outgoing MV feeders, eight per primary substation.
    primary_key: [feeder_id]
    fields:
      feeder_id:
        type: string
        label: Feeder
        dimension: true
        description: Feeder code, such as FD-ALD-03.
        synonyms: [MV circuit, outgoing feeder]
      substation_id:
        type: string
        label: Substation
        description: The substation that supplies this feeder.
      name:
        type: string
        label: Name
        dimension: true
        description: Feeder name.
      voltage_kv:
        type: int
        label: Voltage
        dimension: true
        description: Nominal voltage in kV; 10 or 20.
        examples: [10, 20]
  ASSET:
    table: asset
    description: MV grid assets with their rated capacity; six per feeder.
    primary_key: [asset_id]
    fields:
      asset_id:
        type: string
        label: Asset
        dimension: true
        description: Asset code, such as AS-ALD-03-T2.
        synonyms: [grid component, network element]
      feeder_id:
        type: string
        label: Feeder
        description: The feeder this asset belongs to.
      name:
        type: string
        label: Name
        dimension: true
        description: Asset name.
      asset_type:
        type: string
        label: AssetType
        dimension: true
        description: cable (an MV cable section), transformer (an MV/LV distribution transformer) or mv_room (an MV room where large customers connect).
        examples: [cable, transformer, mv_room]
      rated_mw:
        type: double
        label: RatedCapacity
        description: Rated capacity in MW; utilization is measured against it.
        synonyms: [rating, capacity, nominal capacity]
      commissioning_year:
        type: int
        label: CommissioningYear
        dimension: true
        description: Year the asset went into service.
      latitude:
        type: double
        label: Latitude
        description: Asset latitude in WGS84 degrees.
      longitude:
        type: double
        label: Longitude
        description: Asset longitude in WGS84 degrees.
  LOAD_FORECAST:
    table: load_forecast
    description: Expected yearly peak per asset and direction from 2026 to 2040, with what makes up the peak.
    primary_key: [asset_id, year, direction]
    partition_by: [year]
    instructions: >-
      Each row is one asset's own yearly peak. Peaks of different assets, feeders or directions do
      not occur at the same moment, so never add peak_mw across them; use peak_utilization_pct or
      congested_assets. peak_mw = baseline_mw + spreading_mw + customer_mw.
    fields:
      asset_id:
        type: string
        label: Asset
        description: The asset this forecast is for.
      year:
        type: int
        label: ForecastYear
        dimension: time
        description: Forecast year, from 2026 to 2040.
        synonyms: [forecast year, horizon year]
      direction:
        type: string
        label: Direction
        dimension: true
        description: offtake for power drawn from the grid, feed_in for power fed into the grid.
        examples: [offtake, feed_in]
        synonyms: [power flow direction, demand or generation]
      baseline_mw:
        type: double
        label: BaselineLoad
        description: Peak of the 2025 reference year in MW, before growth.
      spreading_mw:
        type: double
        label: SpreadingLoad
        description: Peak growth in MW that the spreading models assign to this asset; the sum of its SPREADING_CONTRIBUTION rows.
        synonyms: [autonomous growth, technology growth]
      customer_mw:
        type: double
        label: CustomerLoad
        description: Peak load in MW of the large customers connected to this asset; future customers count from their planned_year.
      peak_mw:
        type: double
        label: PeakLoad
        description: Expected yearly peak in MW.
        synonyms: [peak load, maximum load, forecast load]
      utilization_pct:
        type: double
        label: Utilization
        description: peak_mw as a percentage of the asset's rated_mw, rounded to 0.1; 100 or more is congestion.
        synonyms: [loading, utilisation, load factor]
  SPREADING_MODEL:
    table: spreading_model
    description: Spreading models, which distribute the national growth of one technology over the grid.
    primary_key: [model_id]
    fields:
      model_id:
        type: string
        label: SpreadingModel
        dimension: true
        description: Spreading model code, such as SM-EV.
        synonyms: [growth model, allocation model, adoption scenario]
      name:
        type: string
        label: Name
        dimension: true
        description: Spreading model name.
      technology:
        type: string
        label: Technology
        dimension: true
        description: The technology the model distributes.
        examples: [electric_vehicles, heat_pumps, business_electrification, solar_pv, home_batteries]
      direction:
        type: string
        label: Direction
        dimension: true
        description: The direction the model adds load to; offtake or feed_in.
      assumption:
        type: string
        description: The adoption assumption behind the model.
  SPREADING_CONTRIBUTION:
    table: spreading_contribution
    description: What each spreading model adds to an asset's peak, per year and direction.
    primary_key: [asset_id, year, direction, model_id]
    partition_by: [year]
    instructions: >-
      Contributions add up to LOAD_FORECAST.spreading_mw within one asset, year and direction only.
      Home batteries lower the feed-in peak, so their contribution is negative.
    fields:
      asset_id:
        type: string
        label: Asset
        description: The asset the contribution is for.
      year:
        type: int
        label: ForecastYear
        dimension: time
        description: Forecast year, from 2026 to 2040.
      direction:
        type: string
        label: Direction
        dimension: true
        description: offtake or feed_in; always the direction of the spreading model.
      model_id:
        type: string
        label: SpreadingModel
        description: The spreading model that adds this contribution.
      contribution_mw:
        type: double
        label: Contribution
        description: Peak contribution in MW; negative when the model lowers the peak.
        synonyms: [share of growth, growth contribution]
  LARGE_CUSTOMER:
    table: large_customer
    description: Large customers with their own MV connection, connected now or planned in the horizon.
    primary_key: [customer_id]
    instructions: >-
      Connected customers have contracted capacity; future customers have requested capacity and a
      planned_year instead. Report the two groups separately.
    fields:
      customer_id:
        type: string
        label: LargeCustomer
        dimension: true
        description: Customer code, such as LC-0007.
        synonyms: [large consumer, business customer, connection request]
      name:
        type: string
        label: Name
        dimension: true
        description: Fictional customer name.
      sector:
        type: string
        label: Sector
        dimension: true
        description: Business activity of the customer.
        examples: [data_center, greenhouse, logistics, hospital, solar_farm, bus_depot, manufacturing, cold_storage]
      asset_id:
        type: string
        label: Asset
        description: The MV room the customer connects to.
      status:
        type: string
        label: CustomerStatus
        dimension: true
        description: connected for a customer with a signed agreement, future for a request that starts in planned_year.
        examples: [connected, future]
      contracted_offtake_mw:
        type: double
        label: ContractedCapacity
        description: Contracted offtake capacity in MW; NULL for future customers.
      contracted_feed_in_mw:
        type: double
        label: ContractedCapacity
        description: Contracted feed-in capacity in MW; NULL for future customers.
      requested_offtake_mw:
        type: double
        label: RequestedCapacity
        description: Requested offtake capacity in MW; NULL for connected customers.
        synonyms: [requested capacity, capacity request]
      requested_feed_in_mw:
        type: double
        label: RequestedCapacity
        description: Requested feed-in capacity in MW; NULL for connected customers.
      planned_year:
        type: int
        label: PlannedYear
        dimension: true
        description: Year a future customer wants to start; NULL for connected customers.
        synonyms: [desired start year, connection year]
  CONGESTION:
    table: congestion
    description: >-
      Precomputed congestion outlook per asset and direction, derived from LOAD_FORECAST: when
      congestion starts and how severe it gets.
    primary_key: [asset_id, direction]
    derived_from: [LOAD_FORECAST, ASSET]
    instructions: >-
      A congestion point is one asset in one direction whose peak reaches 100 percent of its rating
      in the horizon. Count them with congestion_points; severity follows peak_utilization_pct.
    fields:
      asset_id:
        type: string
        label: Asset
        description: The asset this outlook is for.
      direction:
        type: string
        label: Direction
        dimension: true
        description: offtake or feed_in.
      first_congestion_year:
        type: int
        label: CongestionYear
        dimension: true
        description: First year utilization_pct reaches 100; NULL when the asset stays below it until 2040.
        synonyms: [bottleneck year, year of congestion]
      peak_utilization_pct:
        type: double
        label: Utilization
        description: Highest utilization_pct in the horizon.
      peak_year:
        type: int
        label: ForecastYear
        description: Earliest year with the highest utilization_pct.
      congested_years:
        type: int
        description: Number of forecast years with utilization_pct of 100 or more.
      overload_mw:
        type: double
        label: Overload
        description: Highest peak_mw above rated_mw in MW; 0 when the asset is never congested.
        synonyms: [capacity shortage, shortfall]
      severity:
        type: string
        label: CongestionSeverity
        dimension: true
        description: none below 100 percent, moderate from 100, high from 120 and critical from 150 percent peak utilization.
        examples: [none, moderate, high, critical]
        synonyms: [congestion severity, bottleneck severity]
relationships:
  - {name: feeder_substation, from: FEEDER, to: SUBSTATION, from_columns: [substation_id], to_columns: [substation_id]}
  - {name: asset_feeder, from: ASSET, to: FEEDER, from_columns: [feeder_id], to_columns: [feeder_id]}
  - {name: forecast_asset, from: LOAD_FORECAST, to: ASSET, from_columns: [asset_id], to_columns: [asset_id]}
  - name: contribution_forecast
    from: SPREADING_CONTRIBUTION
    to: LOAD_FORECAST
    from_columns: [asset_id, year, direction]
    to_columns: [asset_id, year, direction]
  - {name: contribution_model, from: SPREADING_CONTRIBUTION, to: SPREADING_MODEL, from_columns: [model_id], to_columns: [model_id]}
  - {name: customer_asset, from: LARGE_CUSTOMER, to: ASSET, from_columns: [asset_id], to_columns: [asset_id]}
  - {name: congestion_asset, from: CONGESTION, to: ASSET, from_columns: [asset_id], to_columns: [asset_id]}
# Each metric reads one dataset, named in full, so the same SQL runs in Polars, DuckDB and governed queries.
metrics:
  peak_utilization_pct:
    description: Highest forecast utilization; the measure for a group of assets, because peaks do not add up.
    sql: max(LOAD_FORECAST.utilization_pct)
    unit: percent of rated capacity
  congested_assets:
    description: Assets whose forecast peak reaches 100 percent of their rating, counted once per asset.
    sql: count(DISTINCT LOAD_FORECAST.asset_id) FILTER (WHERE LOAD_FORECAST.utilization_pct >= 100)
    unit: assets
  congestion_points:
    description: Assets and directions that become congested somewhere in the horizon.
    sql: count(*) FILTER (WHERE CONGESTION.first_congestion_year IS NOT NULL)
    unit: congestion points
  earliest_congestion_year:
    description: The first year any of the assets becomes congested.
    sql: min(CONGESTION.first_congestion_year)
    unit: year
  spreading_contribution_mw:
    description: Peak growth from spreading models; adds up only within one asset, year and direction.
    sql: sum(SPREADING_CONTRIBUTION.contribution_mw)
    unit: MW
  requested_offtake_mw:
    description: Offtake capacity that future customers requested.
    sql: sum(LARGE_CUSTOMER.requested_offtake_mw)
    unit: MW
  requested_feed_in_mw:
    description: Feed-in capacity that future customers requested.
    sql: sum(LARGE_CUSTOMER.requested_feed_in_mw)
    unit: MW
ai_guidance:
  - Peaks are not coincident. Never add peak_mw across assets, feeders, substations or directions; use peak_utilization_pct or congested_assets.
  - Treat offtake and feed-in separately; an asset can be congested in one direction only.
  - A congestion point is one asset in one direction at or above 100 percent utilization. Count them with congestion_points and say when they start with first_congestion_year.
  - Per substation or region, follow CONGESTION or LOAD_FORECAST to ASSET, FEEDER and SUBSTATION.
  - To explain a peak, split it into baseline_mw, spreading_mw and customer_mw, and spreading_mw into SPREADING_CONTRIBUTION per model.
  - Future customers count from their planned_year; report requested and contracted capacity separately.
  - State the year window, the direction and the 100 percent threshold with every answer.
  - This is the baseline forecast; expert adjustments to spreading models in investment proposals are not in the data.
  - Treat results as synthetic demonstrations, not evidence about a real grid. Semantics do not replace access control.
quality_checks:
  - name: Every asset has a forecast for each year and direction
    sql: >-
      SELECT count(*) FROM ASSET a
      LEFT JOIN (SELECT asset_id, count(*) AS n FROM LOAD_FORECAST GROUP BY asset_id) f ON a.asset_id = f.asset_id
      WHERE f.n IS NULL OR f.n <> 30
  - name: Unique non-null keys
    sql: >-
      SELECT (SELECT count(*) - count(DISTINCT substation_id) FROM SUBSTATION)
           + (SELECT count(*) - count(DISTINCT feeder_id) FROM FEEDER)
           + (SELECT count(*) - count(DISTINCT asset_id) FROM ASSET)
           + (SELECT count(*) - count(DISTINCT model_id) FROM SPREADING_MODEL)
           + (SELECT count(*) - count(DISTINCT customer_id) FROM LARGE_CUSTOMER)
           + (SELECT count(*) FROM (SELECT asset_id, year, direction FROM LOAD_FORECAST
                                    GROUP BY asset_id, year, direction HAVING count(*) > 1) d)
           + (SELECT count(*) FROM (SELECT asset_id, year, direction, model_id FROM SPREADING_CONTRIBUTION
                                    GROUP BY asset_id, year, direction, model_id HAVING count(*) > 1) d)
           + (SELECT count(*) FROM (SELECT asset_id, direction FROM CONGESTION
                                    GROUP BY asset_id, direction HAVING count(*) > 1) d)
           + (SELECT count(*) FROM LOAD_FORECAST WHERE asset_id IS NULL OR year IS NULL OR direction IS NULL)
           + (SELECT count(*) FROM SPREADING_CONTRIBUTION
              WHERE asset_id IS NULL OR year IS NULL OR direction IS NULL OR model_id IS NULL)
           + (SELECT count(*) FROM CONGESTION WHERE asset_id IS NULL OR direction IS NULL)
  - name: References resolve
    sql: >-
      SELECT (SELECT count(*) FROM FEEDER f LEFT JOIN SUBSTATION s ON f.substation_id = s.substation_id
              WHERE s.substation_id IS NULL)
           + (SELECT count(*) FROM ASSET a LEFT JOIN FEEDER f ON a.feeder_id = f.feeder_id WHERE f.feeder_id IS NULL)
           + (SELECT count(*) FROM LOAD_FORECAST l LEFT JOIN ASSET a ON l.asset_id = a.asset_id WHERE a.asset_id IS NULL)
           + (SELECT count(*) FROM SPREADING_CONTRIBUTION c LEFT JOIN LOAD_FORECAST l
              ON c.asset_id = l.asset_id AND c.year = l.year AND c.direction = l.direction WHERE l.asset_id IS NULL)
           + (SELECT count(*) FROM SPREADING_CONTRIBUTION c LEFT JOIN SPREADING_MODEL m ON c.model_id = m.model_id
              WHERE m.model_id IS NULL OR m.direction <> c.direction)
           + (SELECT count(*) FROM LARGE_CUSTOMER c LEFT JOIN ASSET a ON c.asset_id = a.asset_id
              WHERE a.asset_id IS NULL OR a.asset_type <> 'mv_room')
           + (SELECT count(*) FROM CONGESTION c LEFT JOIN ASSET a ON c.asset_id = a.asset_id WHERE a.asset_id IS NULL)
  - name: MV scope, years, directions and coordinates are valid
    sql: >-
      SELECT (SELECT count(*) FROM FEEDER WHERE voltage_kv IS NULL OR voltage_kv NOT IN (10, 20))
           + (SELECT count(*) FROM ASSET WHERE rated_mw IS NULL OR rated_mw <= 0
              OR asset_type IS NULL OR asset_type NOT IN ('cable', 'transformer', 'mv_room')
              OR latitude NOT BETWEEN -90 AND 90 OR longitude NOT BETWEEN -180 AND 180)
           + (SELECT count(*) FROM SUBSTATION WHERE latitude NOT BETWEEN -90 AND 90 OR longitude NOT BETWEEN -180 AND 180)
           + (SELECT count(*) FROM LOAD_FORECAST WHERE year NOT BETWEEN 2026 AND 2040
              OR direction NOT IN ('offtake', 'feed_in'))
           + (SELECT count(*) FROM SPREADING_MODEL WHERE direction IS NULL OR direction NOT IN ('offtake', 'feed_in'))
  - name: Forecast peaks add up and match utilization
    sql: >-
      SELECT count(*) FROM LOAD_FORECAST l JOIN ASSET a ON l.asset_id = a.asset_id
      WHERE l.peak_mw IS NULL OR l.utilization_pct IS NULL OR l.baseline_mw < 0 OR l.customer_mw < 0 OR l.peak_mw < 0
         OR abs(l.peak_mw - (l.baseline_mw + l.spreading_mw + l.customer_mw)) > 0.0005
         OR abs(l.utilization_pct - 100 * l.peak_mw / a.rated_mw) > 0.051
  - name: Spreading contributions add up to spreading_mw
    sql: >-
      SELECT count(*) FROM LOAD_FORECAST l
      LEFT JOIN (SELECT asset_id, year, direction, sum(contribution_mw) AS total FROM SPREADING_CONTRIBUTION
                 GROUP BY asset_id, year, direction) c
        ON l.asset_id = c.asset_id AND l.year = c.year AND l.direction = c.direction
      WHERE c.total IS NULL OR abs(c.total - l.spreading_mw) > 0.0005
  - name: Customer status and missing capacities agree
    sql: >-
      SELECT count(*) FROM LARGE_CUSTOMER
      WHERE status IS NULL OR status NOT IN ('connected', 'future')
         OR (status = 'connected' AND (contracted_offtake_mw IS NULL OR contracted_feed_in_mw IS NULL
             OR requested_offtake_mw IS NOT NULL OR requested_feed_in_mw IS NOT NULL OR planned_year IS NOT NULL))
         OR (status = 'future' AND (contracted_offtake_mw IS NOT NULL OR contracted_feed_in_mw IS NOT NULL
             OR requested_offtake_mw IS NULL OR requested_feed_in_mw IS NULL
             OR planned_year IS NULL OR planned_year NOT BETWEEN 2026 AND 2040))
         OR coalesce(contracted_offtake_mw, requested_offtake_mw) < 0
         OR coalesce(contracted_feed_in_mw, requested_feed_in_mw) < 0
  - name: Customer load matches the large customers
    sql: >-
      SELECT count(*) FROM LOAD_FORECAST l
      LEFT JOIN (SELECT l.asset_id, l.year, l.direction,
                        sum(CASE WHEN l.direction = 'offtake'
                                 THEN coalesce(c.contracted_offtake_mw, c.requested_offtake_mw)
                                 ELSE coalesce(c.contracted_feed_in_mw, c.requested_feed_in_mw) END) AS mw
                 FROM LOAD_FORECAST l JOIN LARGE_CUSTOMER c ON c.asset_id = l.asset_id
                 WHERE c.status = 'connected' OR l.year >= c.planned_year
                 GROUP BY l.asset_id, l.year, l.direction) c
        ON l.asset_id = c.asset_id AND l.year = c.year AND l.direction = c.direction
      WHERE abs(l.customer_mw - coalesce(c.mw, 0)) > 0.0005
  - name: The congestion outlook agrees with the forecast
    sql: >-
      SELECT (SELECT count(*) FROM (
                SELECT l.asset_id, l.direction,
                       min(CASE WHEN l.utilization_pct >= 100 THEN l.year END) AS first_year,
                       max(l.utilization_pct) AS peak,
                       sum(CASE WHEN l.utilization_pct >= 100 THEN 1 ELSE 0 END) AS years,
                       max(l.peak_mw - a.rated_mw) AS overload
                FROM LOAD_FORECAST l JOIN ASSET a ON l.asset_id = a.asset_id
                GROUP BY l.asset_id, l.direction) r
              LEFT JOIN CONGESTION c ON r.asset_id = c.asset_id AND r.direction = c.direction
              WHERE c.asset_id IS NULL
                 OR (c.first_congestion_year IS DISTINCT FROM r.first_year)
                 OR (c.peak_utilization_pct IS DISTINCT FROM r.peak)
                 OR (c.congested_years IS DISTINCT FROM r.years)
                 OR abs(c.overload_mw - CASE WHEN r.overload > 0 THEN r.overload ELSE 0 END) > 0.0005
                 OR (c.severity IS DISTINCT FROM CASE WHEN r.peak >= 150 THEN 'critical' WHEN r.peak >= 120 THEN 'high'
                                                      WHEN r.peak >= 100 THEN 'moderate' ELSE 'none' END))
           + (SELECT count(*) FROM CONGESTION c LEFT JOIN LOAD_FORECAST l
              ON c.asset_id = l.asset_id AND c.direction = l.direction AND c.peak_year = l.year
              WHERE l.asset_id IS NULL OR l.utilization_pct <> c.peak_utilization_pct)
  - name: Every dataset is explicitly synthetic
    sql: >-
      SELECT (SELECT count(*) FROM SUBSTATION WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM FEEDER WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM ASSET WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM LOAD_FORECAST WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM SPREADING_MODEL WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM SPREADING_CONTRIBUTION WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM LARGE_CUSTOMER WHERE synthetic IS DISTINCT FROM true)
           + (SELECT count(*) FROM CONGESTION WHERE synthetic IS DISTINCT FROM true)
