name: Release
on:
  push:
    # Branches listed here publish a preview on every push. Any other branch publishes
    # on demand with "Run workflow"; stable releases come from vX.Y.Z tags on main.
    branches: [keycloak]
    tags: ['v*']
    paths-ignore: ['presentation/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  validate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      entrypoint: ${{ steps.version.outputs.entrypoint }}
      slug: ${{ steps.version.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
      - name: Select stable release or branch preview
        id: version
        run: python3 -m scripts.release --channel "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - name: Require stable tags on main
        if: steps.version.outputs.preview != 'true'
        run: |
          # /releases/latest serves stable installers, so a stable release is always a main release.
          git merge-base --is-ancestor HEAD origin/main || { echo 'Tag a commit on main for a stable release' >&2; exit 1; }
      - run: uv sync --locked --all-groups
      - run: uv run --all-groups marimo check user_portal/notebook/template.py user_portal/notebook/examples/*.py
      - name: Build matching source, bundle and installers
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: uv run python -m scripts.release --build --install --release-tag "$RELEASE_TAG" --image-tag "$IMAGE_TAG"
      - name: Scan source archive
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/source-scan"
          tar -xzf "dist/iceberg-data-platform-${VERSION}.tar.gz" -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-scan" --redact --no-banner
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: dist/
          if-no-files-found: error
  images:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [portal, users, notebook]
        arch: [amd64, arm64]
        include:
          - image: portal
            dockerfile: Dockerfile
          - image: users
            dockerfile: user_portal/Dockerfile
          - image: notebook
            dockerfile: user_portal/notebook/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ needs.validate.outputs.image_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-platform images
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          PREVIEW: ${{ needs.validate.outputs.preview }}
        run: |
          for component in portal users notebook; do
            image="${REGISTRY}-${component}"
            aliases=(--tag "${image}:${IMAGE_TAG}")
            if [ "$PREVIEW" != true ]; then
              aliases+=(--tag "${image}:latest")
            fi
            docker buildx imagetools create "${aliases[@]}" \
              "${image}:${IMAGE_TAG}-amd64" "${image}:${IMAGE_TAG}-arm64"
          done
      - name: Check public image access
        if: needs.validate.outputs.preview == 'true'
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          anonymous_config=$(mktemp -d)
          for component in portal users notebook; do
            docker --config "$anonymous_config" manifest inspect "${REGISTRY}-${component}:${IMAGE_TAG}" > /dev/null
          done
      - name: Publish branch preview
        if: needs.validate.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          ENTRYPOINT: ${{ needs.validate.outputs.entrypoint }}
        run: |
          stable_before=$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name || true)
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF_NOTES
          ## Try the ${BRANCH} branch

          This preview was built and tested from commit ${GITHUB_SHA} on the ${BRANCH} branch.

          **Linux / macOS**

          \`curl -fsSL https://github.com/${GH_REPO}/releases/download/${ENTRYPOINT}/install.sh | sh\`

          **Windows PowerShell**

          \`irm https://github.com/${GH_REPO}/releases/download/${ENTRYPOINT}/install.ps1 | iex\`

          Requires Docker with Compose v2 and a fresh installation. Uses the same project names, volumes and ports as stable; use a separate Docker environment to test alongside an existing installation.

          Open http://localhost:3000 and use PLATFORM_ADMIN_USERNAME and PLATFORM_ADMIN_PASSWORD from ~/iceberg-data-platform/.env. Change the initial password, then create a team, database and user. The user portal is http://localhost:3002 and Keycloak is http://localhost:8080/admin. No demo accounts or data are created automatically.

          [Exact build and source](https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}). Its installers and all application images are pinned to this build. The ${ENTRYPOINT} release holds only the current installer entrypoints; use the exact build for source archives.

          Rerunning the preview command installs the most recently published successful build. Existing installations do not update automatically. Stable latest releases and image tags are unchanged.
          EOF_NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Preview ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
          if gh release view "$ENTRYPOINT" > /dev/null 2>&1; then
            gh release upload "$ENTRYPOINT" dist/install.sh dist/install.ps1 --clobber
            gh release edit "$ENTRYPOINT" --prerelease --latest=false --notes-file "$RUNNER_TEMP/preview-notes.md"
          else
            gh release create "$ENTRYPOINT" dist/install.sh dist/install.ps1 --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Preview of ${BRANCH} — install here" --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
          # A preview must never take over the stable installation command.
          stable_after=$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name || true)
          [ "$stable_before" = "$stable_after" ] || { echo "Latest release changed from ${stable_before} to ${stable_after}" >&2; exit 1; }
          if [ -n "$stable_after" ]; then
            curl -fsSL "https://github.com/${GH_REPO}/releases/latest/download/install.sh" > /dev/null
          fi
      - name: Prune older builds of this branch
        if: needs.validate.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SLUG: ${{ needs.validate.outputs.slug }}
        run: |
          # Keep the five newest exact builds; run ids only increase. Entrypoints, other
          # branches and stable releases never match SLUG-RUN_ID-ATTEMPT.
          gh release list --limit 200 --json tagName,isPrerelease --jq '($ENV.SLUG + "-") as $prefix
              | [.[] | select(.isPrerelease and (.tagName | startswith($prefix)))
              | .tagName | select(ltrimstr($prefix) | test("^[0-9]+-[0-9]+$"))]
              | sort_by(ltrimstr($prefix) | split("-") | map(tonumber)) | reverse | .[5:][]' |
            while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
            done
      - name: Publish release and installation bundle
        if: needs.validate.outputs.preview != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF_NOTES
          ## Install with one command

          With Docker running, use the command for your platform:

          **Linux / macOS**

          \`curl -fsSL https://github.com/${GH_REPO}/releases/latest/download/install.sh | sh\`

          **Windows PowerShell**

          \`irm https://github.com/${GH_REPO}/releases/latest/download/install.ps1 | iex\`

          The installer creates configuration and random credentials, pulls the images of this release and starts both stacks. Open http://localhost:3000 and sign in with the PLATFORM_ADMIN_USERNAME and initial PLATFORM_ADMIN_PASSWORD from ~/iceberg-data-platform/.env. Keycloak is available on http://localhost:8080.

          The commands above always install the newest release. To install exactly this version, replace \`latest/download\` with \`download/v${VERSION}\`; its installers, Compose files and images are pinned to ${VERSION}.

          Prebuilt images support Linux AMD64 and ARM64:
          - \`ghcr.io/${GH_REPO}-portal:${VERSION}\`
          - \`ghcr.io/${GH_REPO}-users:${VERSION}\`
          - \`ghcr.io/${GH_REPO}-notebook:${VERSION}\`

          The installation bundle requires only Docker with Compose. It generates local credentials and preserves existing configuration and data volumes.
          EOF_NOTES
          # Only the highest version serves /releases/latest; a later fix on an older line must not.
          highest=$({ gh release list --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "v${VERSION}"; } | sort -V | tail -n 1)
          if [ "$highest" = "v${VERSION}" ]; then latest=true; else latest=false; fi
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
            gh release edit "v${VERSION}" --latest="$latest"
          else
            gh release create "v${VERSION}" dist/* --verify-tag --latest="$latest" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          [ "$latest" = true ] || exit 0
          # The documented installation command must now serve this release.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://github.com/${GH_REPO}/releases/latest/download/install.sh" | grep -qF "release_tag=v${VERSION}" &&
               curl -fsSL "https://github.com/${GH_REPO}/releases/latest/download/install.ps1" | grep -qF "ReleaseTag = 'v${VERSION}'"; then
              exit 0
            fi
            sleep 10
          done
          echo "releases/latest/download does not serve v${VERSION}" >&2
          exit 1
