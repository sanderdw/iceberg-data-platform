name: Maintenance extension CI
# The Maintenance extension (extensions/maintenance, beta) is tested and released on its own. It runs when the
# extension, the Bridge contract it depends on, or the Bridge implementation changes.
on:
  push:
    branches: [main]
    paths: &paths
      - 'extensions/maintenance/**'
      - '!extensions/maintenance/*.md'
      - '!extensions/maintenance/LICENSE'
      - '!extensions/maintenance/NOTICE'
      - 'contracts/bridge/**'
      - 'server/bridge.py'
      - 'server/polaris.py'
      - '.github/workflows/maintenance-ci.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: maintenance-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: extensions/maintenance
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          enable-cache: true
          cache-dependency-glob: extensions/maintenance/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python -m scripts.release
      - run: node --check maintenance/public/app.js
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/maintenance/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go formatting, vet and tests (iceberg-go on a local catalog)
        run: |
          docker run --rm -v "$PWD":/src -w /src golang:1.26.3-bookworm sh -c \
            'test -z "$(gofmt -l .)" && go vet ./... && go test -count=1 ./... && go mod verify'
      - run: docker build -t runner-check .
      - name: The runner refuses to start without a job, read-only, as the runner user, without network
        run: |
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 -e MNT_WORK_DIR=/tmp/work runner-check
          test $? -eq 1

  integration:
    # The platform from this commit and the Maintenance extension, end to end through MCP.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m scripts.setup --demo --extension maintenance --origin http://localhost:3013 --handshake extensions/maintenance/.env.bridge
      - run: docker compose up -d --build --wait
      - run: docker compose run --build --rm keycloak-bootstrap --demo
      - name: Make demo-admin an administrator of demo-team (test fixture)
        run: |
          uv run --all-groups python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv(".env")
          from server.polaris import PolarisProvider
          from server.storage import RustFSStorage
          provider = PolarisProvider(os.environ, RustFSStorage(os.environ))
          team = next(t for t in provider.list_teams() if t["name"] == "demo-team")["id"]
          admin = next(u for u in provider.list_users() if u["name"] == "demo-admin")
          provider.update_memberships(admin["id"], {**{m["team"]: m["role"] for m in admin["memberships"]}, team: "admin"})
          PY
      - name: Start the Maintenance extension
        working-directory: extensions/maintenance
        run: |
          uv sync --locked
          uv run python -m scripts.setup
          docker compose --profile images build
          docker compose up -d --build --wait
      - name: End-to-end through MCP
        working-directory: extensions/maintenance
        run: uv run python -m scripts.e2e_smoke
      - name: Logs on failure
        if: failure()
        working-directory: extensions/maintenance
        run: docker compose logs --tail 200
      - name: Clean up
        if: always()
        run: |
          (cd extensions/maintenance && docker compose down --remove-orphans --volumes) || true
          docker compose down --remove-orphans --volumes || true

  compat:
    # The same checks against the newest platform release that ships the Bridge: the extension
    # must work with released platforms, not only with the commit it was changed with.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the newest platform release with the Bridge
        id: core
        run: |
          for tag in $(git tag --list 'v*' --sort=-version:refname); do
            if git cat-file -e "$tag:contracts/bridge/v1/openapi.yaml" 2>/dev/null; then echo "tag=$tag" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No platform release ships the Bridge yet; the integration job covers this commit." >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.core.outputs.tag
        with:
          version: '0.13.8'
      - name: Start that platform release
        if: steps.core.outputs.tag
        env:
          TAG: ${{ steps.core.outputs.tag }}
        run: |
          git worktree add ../core-release "$TAG"
          cd ../core-release
          uv sync --locked --all-groups
          uv run python -m scripts.setup --demo --extension maintenance --origin http://localhost:3013 --handshake "$GITHUB_WORKSPACE/extensions/maintenance/.env.bridge"
          docker compose up -d --build --wait
          docker compose run --build --rm keycloak-bootstrap --demo
          uv run --all-groups python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv(".env")
          from server.polaris import PolarisProvider
          from server.storage import RustFSStorage
          provider = PolarisProvider(os.environ, RustFSStorage(os.environ))
          team = next(t for t in provider.list_teams() if t["name"] == "demo-team")["id"]
          admin = next(u for u in provider.list_users() if u["name"] == "demo-admin")
          provider.update_memberships(admin["id"], {**{m["team"]: m["role"] for m in admin["memberships"]}, team: "admin"})
          PY
      - name: This commit's Maintenance extension against it
        if: steps.core.outputs.tag
        working-directory: extensions/maintenance
        run: |
          uv sync --locked
          uv run python -m scripts.setup
          docker compose --profile images build
          docker compose up -d --build --wait
          PLATFORM_ENV=../../../core-release/.env uv run python -m scripts.e2e_smoke
      - name: Clean up
        if: always() && steps.core.outputs.tag
        run: |
          (cd extensions/maintenance && docker compose down --remove-orphans --volumes) || true
          (cd ../core-release && docker compose down --remove-orphans --volumes) || true
