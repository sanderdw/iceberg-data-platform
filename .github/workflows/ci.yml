name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['presentation/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: npm run verify
      - run: uv run --all-groups marimo check user_portal/notebook/template.py user_portal/notebook/examples/*.py
      - run: npm run release:source
      - name: Scan the actual source release for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/source-scan"
          tar -xzf dist/iceberg-data-platform-*.tar.gz -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-scan" --redact --no-banner
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - run: npm audit
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run python -m scripts.setup
      - name: Start native API test fixtures
        run: |
          docker compose -f compose.yaml -f - up -d --build --wait <<'YAML'
          services:
            portal:
              command: ["/app/.venv/bin/uvicorn", "server.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "3000", "--no-access-log"]
          YAML
      - run: docker compose -f compose.users.yaml --profile images build
      - name: Start native workspace API test fixture
        run: |
          docker compose -f compose.users.yaml -f - up -d --wait users <<'YAML'
          services:
            users:
              command: ["/app/.venv/bin/uvicorn", "user_portal.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "3002", "--no-access-log"]
          YAML
      - run: UV_NO_SYNC=1 npm run test:e2e
      - run: npm run test:catalog
      - run: npm run test:shares-ui
      - run: npm run test:forms-ui
      - run: npm run test:navigation-ui
      - run: uv run --all-groups python -m scripts.catalog_smoke
      - run: uv run --all-groups python -m scripts.smoke
      - run: uv run --all-groups python -m scripts.data_smoke
      - run: uv run --all-groups python -m scripts.share_smoke
      - run: npm run test:examples
      - name: Preserve browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-failure-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean this runner's development stacks
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f compose.users.yaml down --remove-orphans
            docker compose down --remove-orphans --volumes
          fi
  notebook-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build notebook image
        run: docker build -f user_portal/notebook/Dockerfile -t notebook-check .
      - name: Check startup and exports without network access
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=256m,mode=1777 --tmpfs /work:rw,size=64m,uid=10001,gid=10001 \
            -e HOME=/tmp/home --entrypoint /app/.venv/bin/python notebook-check - \
            < scripts/notebook-image-smoke.py
  keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run python -m scripts.setup --demo
      - run: docker compose -f compose.users.yaml --profile images build notebook-image
      - run: docker compose up -d --build --wait
      - run: docker compose -f compose.users.yaml up -d --build --wait users
      - run: node scripts/keycloak-onboarding-smoke.mjs
      - run: docker compose run --build --rm keycloak-bootstrap --demo
      - run: npm run test:keycloak
      - name: Clean this runner's Keycloak stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f compose.users.yaml down --remove-orphans
            docker compose down --remove-orphans --volumes
          fi
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          python-version: '3.14.7'
      - name: Test native installers without starting Docker
        run: uv run --no-project --with pytest==9.1.1 python -m pytest --noconftest test/test_installer.py
