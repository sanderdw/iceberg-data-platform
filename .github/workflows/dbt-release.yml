name: dbt stack release
# Releases of the dbt stack are independent of platform releases (v* tags): tag dbt-vX.Y.Z.
on:
  push:
    tags: ['dbt-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbt-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/dbt-ci.yml
  validate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: stacks/dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
      - id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          uv run --no-project python -m scripts.release --tag "$tag" --build
          echo "version=${tag#dbt-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbt-source
          path: stacks/dbt/dist/
          if-no-files-found: error
  images:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [iceberg-dbt, iceberg-dbt-runner]
        arch: [amd64, arm64]
        include:
          - image: iceberg-dbt
            dockerfile: stacks/dbt/Dockerfile
          - image: iceberg-dbt-runner
            dockerfile: stacks/dbt/runner/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names are explicit so that moving the stack to its own repository keeps them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stacks/dbt
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/sanderdw/${{ matrix.image }}:${{ needs.validate.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dbt-source
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform images
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for image in iceberg-dbt iceberg-dbt-runner; do
            docker buildx imagetools create --tag "ghcr.io/sanderdw/${image}:${VERSION}" \
              "ghcr.io/sanderdw/${image}:${VERSION}-amd64" "ghcr.io/sanderdw/${image}:${VERSION}-arm64"
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "dbt-v${VERSION}" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --title "dbt stack ${VERSION}" --notes "dbt stack ${VERSION} for the Iceberg Data Platform (Bridge contract 1.x). Images: ghcr.io/sanderdw/iceberg-dbt:${VERSION} and ghcr.io/sanderdw/iceberg-dbt-runner:${VERSION}."
