name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'zensical.toml', 'presentation/**', 'CHANGELOG.md', 'pyproject.toml', 'uv.lock', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'zensical.toml', 'presentation/**', 'CHANGELOG.md', 'pyproject.toml', 'uv.lock', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    # Builds the documentation with the presentation under /presentation/ and copies it onto the
    # gh-pages branch, which GitHub Pages serves. Pull requests only build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.13.0'
          enable-cache: true
      - name: Check documentation links and the release allowlist
        run: python3 -m scripts.release
      - name: Build the documentation
        run: uv run --locked --only-group docs zensical build --clean --strict
      - name: Add the presentation
        run: |
          set -euo pipefail
          test ! -e site/presentation
          cp -R presentation site/presentation
          touch site/.nojekyll
          test -f site/index.html && test -f site/presentation/index.html
      - name: Publish site/ to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          cd site
          git init -q -b gh-pages
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish documentation and presentation from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
