name: Ingestion extension release
# Releases of the Ingestion extension are independent of platform releases (v* tags): tag ingestion-vX.Y.Z.
# Run workflow on a branch publishes a preview: images and a prerelease tagged BRANCH-RUN_ID-ATTEMPT.
on:
  push:
    tags: ['ingestion-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingestion-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ingestion-ci.yml
  validate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      slug: ${{ steps.version.outputs.slug }}
    defaults:
      run:
        working-directory: extensions/ingestion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - id: version
        run: uv run --no-project python -m scripts.release --channel "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - name: Check and build the source archive
        env:
          PREVIEW: ${{ steps.version.outputs.preview }}
        run: |
          if [ "$PREVIEW" = true ]; then
            uv run --no-project python -m scripts.release --build
          else
            uv run --no-project python -m scripts.release --tag "$GITHUB_REF_NAME" --build
          fi
      - name: Package the Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          PREVIEW: ${{ steps.version.outputs.preview }}
        run: |
          sh ../../dev/kubernetes/tools.sh "$RUNNER_TEMP/bin"
          # A chart version is SemVer: a preview's chart is the coming version plus its image tag.
          chart="$VERSION"; [ "$PREVIEW" != true ] || chart="$VERSION-$IMAGE_TAG"
          "$RUNNER_TEMP/bin/helm" package deploy/helm/iceberg-ingestion --version "$chart" --app-version "$IMAGE_TAG" -d dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingestion-source
          path: extensions/ingestion/dist/
          if-no-files-found: error
  images:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [iceberg-ingestion, iceberg-ingestion-runner]
        arch: [amd64, arm64]
        include:
          - image: iceberg-ingestion
            dockerfile: extensions/ingestion/Dockerfile
            context: extensions/ingestion
          - image: iceberg-ingestion-runner
            dockerfile: extensions/ingestion/runner/Dockerfile
            context: extensions/ingestion
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names are explicit so that moving the extension to its own repository keeps them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/sanderdw/${{ matrix.image }}:${{ needs.validate.outputs.image_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ingestion-source
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform images
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          for image in iceberg-ingestion iceberg-ingestion-runner; do
            docker buildx imagetools create --tag "ghcr.io/sanderdw/${image}:${IMAGE_TAG}" \
              "ghcr.io/sanderdw/${image}:${IMAGE_TAG}-amd64" "ghcr.io/sanderdw/${image}:${IMAGE_TAG}-arm64"
          done
      - name: Publish the Helm chart
        # Like the images, a new GHCR package starts private: make charts/iceberg-ingestion public, then re-run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  '"$RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          helm="$RUNNER_TEMP/linux-amd64/helm"
          echo "$GH_TOKEN" | "$helm" registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          package=$(ls dist/iceberg-ingestion-*.tgz)
          "$helm" push "$package" oci://ghcr.io/sanderdw/charts
          version=$(basename "$package" .tgz); version=${version#iceberg-ingestion-}
          HELM_REGISTRY_CONFIG=$(mktemp) "$helm" show chart oci://ghcr.io/sanderdw/charts/iceberg-ingestion --version "$version" > /dev/null \
            || { echo "ghcr.io/sanderdw/charts/iceberg-ingestion is not public" >&2; exit 1; }
      - name: The images are public
        # The platform installer pulls them without signing in. A new GHCR package starts private:
        # make it public in the package settings, then re-run this job.
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          for image in iceberg-ingestion iceberg-ingestion-runner; do
            docker --config "$(mktemp -d)" manifest inspect "ghcr.io/sanderdw/${image}:${IMAGE_TAG}" >/dev/null \
              || { echo "ghcr.io/sanderdw/${image} is not public" >&2; exit 1; }
          done
      - name: Create the GitHub release
        if: needs.validate.outputs.preview != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        # Never "latest": releases/latest/download/install.sh must stay the platform's installer.
        run: |
          gh release create "ingestion-v${VERSION}" dist/*.tar.gz dist/*.tgz --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Ingestion (dlt) ${VERSION}" --notes "Ingestion (dlt) ${VERSION} for the Iceberg Data Platform (Bridge contract 0.1). Images: ghcr.io/sanderdw/iceberg-ingestion:${VERSION} and ghcr.io/sanderdw/iceberg-ingestion-runner:${VERSION}."
      - name: Create the preview prerelease
        if: needs.validate.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.tgz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Ingestion (dlt) preview ${IMAGE_TAG}" \
            --notes "Ingestion (dlt) ${VERSION} built from commit ${GITHUB_SHA} on the ${BRANCH} branch (Bridge contract 0.1). Images: ghcr.io/sanderdw/iceberg-ingestion:${IMAGE_TAG} and ghcr.io/sanderdw/iceberg-ingestion-runner:${IMAGE_TAG}."
      - name: Prune older previews of this branch
        if: needs.validate.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.validate.outputs.slug }}
        run: |
          # Keep the five newest previews of this branch; run ids only increase.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease --jq \
            '("ingestion-" + $ENV.SLUG + "-") as $prefix
              | [.[] | select(.isPrerelease and (.tagName | startswith($prefix)))
              | .tagName | select(ltrimstr($prefix) | test("^[0-9]+-[0-9]+$"))]
              | sort_by(ltrimstr($prefix) | split("-") | map(tonumber)) | reverse | .[5:][]' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
