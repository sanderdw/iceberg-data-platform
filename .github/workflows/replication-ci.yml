name: Replication extension CI
# The Replication extension (extensions/replication, beta) is tested and released on its own. It runs when the extension, the
# Bridge contract it depends on, or the Bridge implementation changes.
on:
  push:
    branches: [main]
    paths: &paths
      - 'extensions/replication/**'
      - '!extensions/replication/*.md'
      - '!extensions/replication/LICENSE'
      - '!extensions/replication/NOTICE'
      - 'contracts/bridge/**'
      - 'server/bridge.py'
      - 'scripts/bridge_compat.py'
      - 'server/polaris.py'
      - '.github/workflows/replication-ci.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: replication-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: extensions/replication
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true
          cache-dependency-glob: extensions/replication/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python -m scripts.release
      - run: node --check replication/public/app.js
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  runner-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f runner/Dockerfile -t runner-check .
      - name: The start-up program and OLake load without network, read-only, as the runner user
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --entrypoint sh runner-check -c \
            "python3 -c 'import runner.entrypoint, runner.remote' && /home/olake --help >/dev/null && echo OLake \$DRIVER_VERSION"

  integration:
    # The platform from this commit and the Replication extension, end to end through MCP.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m scripts.setup --demo --extension replication --origin http://localhost:3014 --handshake extensions/replication/.env.bridge
      - run: docker compose up -d --build --wait
      - run: docker compose run --build --rm keycloak-bootstrap --demo
      - name: Make demo-admin an administrator of demo-team (test fixture)
        run: |
          uv run --all-groups python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv(".env")
          from server.polaris import PolarisProvider
          from server.storage import RustFSStorage
          provider = PolarisProvider(os.environ, RustFSStorage(os.environ))
          team = next(t for t in provider.list_teams() if t["name"] == "demo-team")["id"]
          admin = next(u for u in provider.list_users() if u["name"] == "demo-admin")
          provider.update_memberships(admin["id"], {**{m["team"]: m["role"] for m in admin["memberships"]}, team: "admin"})
          PY
      - name: A test-only PostgreSQL source on the host
        run: docker run -d --name rep-e2e-postgres -e POSTGRES_USER=e2e -e POSTGRES_PASSWORD=e2e-password -e POSTGRES_DB=e2e -p 55432:5432 --health-cmd "pg_isready -U e2e" --health-interval 2s postgres:18-alpine -c wal_level=logical
      - name: Start the Replication extension (private sources allowed for the host's test sources)
        working-directory: extensions/replication
        env:
          REP_ALLOW_PRIVATE_SOURCES: 'true'
        run: |
          uv sync --locked
          uv run python -m scripts.setup
          docker compose --profile images build
          docker compose up -d --build --wait
      - name: End-to-end through MCP
        working-directory: extensions/replication
        env:
          E2E_POSTGRES_PORT: '55432'
        run: uv run python -m scripts.e2e_smoke
      - name: Logs on failure
        if: failure()
        working-directory: extensions/replication
        run: docker compose logs --tail 200
      - name: Clean up
        if: always()
        run: |
          (cd extensions/replication && docker compose down --remove-orphans --volumes) || true
          docker rm -f rep-e2e-postgres || true
          docker compose down --remove-orphans --volumes || true

  compat:
    # The same checks against the newest platform release that ships the Bridge: the extension
    # must work with released platforms, not only with the commit it was changed with.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the newest platform release, if its Bridge contract is in this extension's range
        id: core
        # Skips the steps below, and says why in the summary, when the release is outside the range.
        run: python3 scripts/bridge_compat.py replication
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.core.outputs.tag
        with:
          version: '0.13.10'
      - name: Start that platform release
        if: steps.core.outputs.tag
        env:
          TAG: ${{ steps.core.outputs.tag }}
        run: |
          git worktree add ../core-release "$TAG"
          cd ../core-release
          uv sync --locked --all-groups
          uv run python -m scripts.setup --demo --extension replication --origin http://localhost:3014 --handshake "$GITHUB_WORKSPACE/extensions/replication/.env.bridge"
          docker compose up -d --build --wait
          docker compose run --build --rm keycloak-bootstrap --demo
          uv run --all-groups python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv(".env")
          from server.polaris import PolarisProvider
          from server.storage import RustFSStorage
          provider = PolarisProvider(os.environ, RustFSStorage(os.environ))
          team = next(t for t in provider.list_teams() if t["name"] == "demo-team")["id"]
          admin = next(u for u in provider.list_users() if u["name"] == "demo-admin")
          provider.update_memberships(admin["id"], {**{m["team"]: m["role"] for m in admin["memberships"]}, team: "admin"})
          PY
      - name: A test-only PostgreSQL source with logical replication on the host
        if: steps.core.outputs.tag
        run: docker run -d --name rep-e2e-postgres -e POSTGRES_USER=e2e -e POSTGRES_PASSWORD=e2e-password -e POSTGRES_DB=e2e -p 55432:5432 --health-cmd "pg_isready -U e2e" --health-interval 2s postgres:18-alpine -c wal_level=logical
      - name: This commit's Replication extension against it
        if: steps.core.outputs.tag
        working-directory: extensions/replication
        env:
          REP_ALLOW_PRIVATE_SOURCES: 'true'
          E2E_POSTGRES_PORT: '55432'
        run: |
          uv sync --locked
          uv run python -m scripts.setup
          docker compose --profile images build
          docker compose up -d --build --wait
          PLATFORM_ENV=../../../core-release/.env uv run python -m scripts.e2e_smoke
      - name: Clean up
        if: always() && steps.core.outputs.tag
        run: |
          (cd extensions/replication && docker compose down --remove-orphans --volumes) || true
          (cd ../core-release && docker compose down --remove-orphans --volumes) || true
          docker rm -f rep-e2e-postgres || true
