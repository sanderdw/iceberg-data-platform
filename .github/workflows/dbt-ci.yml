name: dbt stack CI
# The dbt stack (stacks/dbt) is tested and released on its own. It runs when the stack, the
# Bridge contract it depends on, or the Bridge implementation changes.
on:
  push:
    branches: [main]
    paths: ['stacks/dbt/**', 'contracts/bridge/**', 'server/bridge.py', 'server/polaris.py', '.github/workflows/dbt-*.yml']
  pull_request:
    paths: ['stacks/dbt/**', 'contracts/bridge/**', 'server/bridge.py', 'server/polaris.py', '.github/workflows/dbt-*.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: stacks/dbt
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: stacks/dbt/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python -m scripts.release
      - run: node --check dbt_portal/public/app.js && node --check dbt_portal/public/graph.js
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  runner-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f runner/Dockerfile -t runner-check .
      - name: dbt and DuckDB work without network, read-only, as the runner user
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --entrypoint dbt runner-check --version
          docker run --rm --network none --read-only --tmpfs /tmp --user 10001:10001 --entrypoint python runner-check \
            -c "import duckdb; c = duckdb.connect(); c.execute('LOAD httpfs; LOAD iceberg'); print('extensions ok')"

  integration:
    # The platform from this commit and the dbt stack, end to end through MCP.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m scripts.setup --demo --extension dbt --origin http://localhost:3004 --handshake stacks/dbt/.env.bridge
      - run: docker compose up -d --build --wait
      - run: docker compose run --build --rm keycloak-bootstrap --demo
      - name: Make demo-admin an administrator of demo-team (test fixture)
        run: |
          uv run --all-groups python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv(".env")
          from server.polaris import PolarisProvider
          from server.storage import RustFSStorage
          provider = PolarisProvider(os.environ, RustFSStorage(os.environ))
          team = next(t for t in provider.list_teams() if t["name"] == "demo-team")["id"]
          admin = next(u for u in provider.list_users() if u["name"] == "demo-admin")
          provider.update_memberships(admin["id"], {**{m["team"]: m["role"] for m in admin["memberships"]}, team: "admin"})
          PY
      - name: Start the dbt stack
        working-directory: stacks/dbt
        run: |
          uv sync --locked
          uv run python -m scripts.setup
          docker compose --profile images build
          docker compose up -d --build --wait
      - name: End-to-end through MCP
        working-directory: stacks/dbt
        run: uv run python -m scripts.e2e_smoke
      - name: Logs on failure
        if: failure()
        working-directory: stacks/dbt
        run: docker compose logs --tail 200
      - name: Clean up
        if: always()
        run: |
          (cd stacks/dbt && docker compose down --remove-orphans --volumes) || true
          docker compose down --remove-orphans --volumes || true

  compat:
    # The same checks against the newest platform release that ships the Bridge: the stack
    # must work with released platforms, not only with the commit it was changed with.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the newest platform release with the Bridge
        id: core
        run: |
          for tag in $(git tag --list 'v*' --sort=-version:refname); do
            if git cat-file -e "$tag:contracts/bridge/v1/openapi.yaml" 2>/dev/null; then echo "tag=$tag" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No platform release ships the Bridge yet; the integration job covers this commit." >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.core.outputs.tag
        with:
          version: '0.12.18'
      - name: Start that platform release
        if: steps.core.outputs.tag
        env:
          TAG: ${{ steps.core.outputs.tag }}
        run: |
          git worktree add ../core-release "$TAG"
          cd ../core-release
          uv sync --locked --all-groups
          uv run python -m scripts.setup --demo --extension dbt --origin http://localhost:3004 --handshake "$GITHUB_WORKSPACE/stacks/dbt/.env.bridge"
          docker compose up -d --build --wait
          docker compose run --build --rm keycloak-bootstrap --demo
          uv run --all-groups python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv(".env")
          from server.polaris import PolarisProvider
          from server.storage import RustFSStorage
          provider = PolarisProvider(os.environ, RustFSStorage(os.environ))
          team = next(t for t in provider.list_teams() if t["name"] == "demo-team")["id"]
          admin = next(u for u in provider.list_users() if u["name"] == "demo-admin")
          provider.update_memberships(admin["id"], {**{m["team"]: m["role"] for m in admin["memberships"]}, team: "admin"})
          PY
      - name: This commit's dbt stack against it
        if: steps.core.outputs.tag
        working-directory: stacks/dbt
        run: |
          uv sync --locked
          uv run python -m scripts.setup
          docker compose --profile images build
          docker compose up -d --build --wait
          PLATFORM_ENV=../../../core-release/.env uv run python -m scripts.e2e_smoke
      - name: Clean up
        if: always() && steps.core.outputs.tag
        run: |
          (cd stacks/dbt && docker compose down --remove-orphans --volumes) || true
          (cd ../core-release && docker compose down --remove-orphans --volumes) || true
