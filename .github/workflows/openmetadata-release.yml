name: OpenMetadata extension release
# Releases of the OpenMetadata extension are independent of platform releases (v* tags): tag openmetadata-vX.Y.Z.
# Run workflow on a branch publishes a preview: images and a prerelease tagged BRANCH-RUN_ID-ATTEMPT.
on:
  push:
    tags: ['openmetadata-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmetadata-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/openmetadata-ci.yml
  validate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      slug: ${{ steps.version.outputs.slug }}
    defaults:
      run:
        working-directory: extensions/openmetadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
      - id: version
        run: uv run --no-project python -m scripts.release --channel "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - name: Check and build the source archive, installation bundle and installer
        env:
          PREVIEW: ${{ steps.version.outputs.preview }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          # install.sh downloads the bundle from this same release; the bundle runs this release's image.
          tag=()
          [ "$PREVIEW" = true ] || tag=(--tag "$GITHUB_REF_NAME")
          uv run --no-project python -m scripts.release "${tag[@]}" --build --install \
            --release-tag "$RELEASE_TAG" --image-tag "$IMAGE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmetadata-source
          path: extensions/openmetadata/dist/
          if-no-files-found: error
  images:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [iceberg-openmetadata]
        arch: [amd64, arm64]
        include:
          - image: iceberg-openmetadata
            dockerfile: extensions/openmetadata/Dockerfile
            context: extensions/openmetadata
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names are explicit so that moving the extension to its own repository keeps them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/sanderdw/${{ matrix.image }}:${{ needs.validate.outputs.image_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openmetadata-source
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform images
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          for image in iceberg-openmetadata; do
            docker buildx imagetools create --tag "ghcr.io/sanderdw/${image}:${IMAGE_TAG}" \
              "ghcr.io/sanderdw/${image}:${IMAGE_TAG}-amd64" "ghcr.io/sanderdw/${image}:${IMAGE_TAG}-arm64"
          done
      - name: The images are public
        # The platform installer pulls them without signing in. A new GHCR package starts private:
        # make it public in the package settings, then re-run this job.
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          for image in iceberg-openmetadata; do
            docker --config "$(mktemp -d)" manifest inspect "ghcr.io/sanderdw/${image}:${IMAGE_TAG}" >/dev/null \
              || { echo "ghcr.io/sanderdw/${image} is not public" >&2; exit 1; }
          done
      - name: Create the GitHub release
        if: needs.validate.outputs.preview != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        # Never "latest": releases/latest/download/install.sh must stay the platform's installer.
        run: |
          gh release create "openmetadata-v${VERSION}" dist/*.tar.gz dist/install.sh dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "OpenMetadata ${VERSION}" --notes "OpenMetadata ${VERSION} for the Iceberg Data Platform (Bridge contract 0.1.1, capability listings). Image: ghcr.io/sanderdw/iceberg-openmetadata:${VERSION}.

          Add it to an installed platform: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/openmetadata-v${VERSION}/install.sh | sh\` (append \`-s -- --demo\` for a local OpenMetadata)."
      - name: Create the preview prerelease
        if: needs.validate.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/install.sh dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "OpenMetadata preview ${IMAGE_TAG}" \
            --notes "OpenMetadata ${VERSION} built from commit ${GITHUB_SHA} on the ${BRANCH} branch (Bridge contract 0.1.1). Image: ghcr.io/sanderdw/iceberg-openmetadata:${IMAGE_TAG}. Install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/install.sh | sh\`"
      - name: Prune older previews of this branch
        if: needs.validate.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.validate.outputs.slug }}
        run: |
          # Keep the five newest previews of this branch; run ids only increase.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease --jq \
            '("openmetadata-" + $ENV.SLUG + "-") as $prefix
              | [.[] | select(.isPrerelease and (.tagName | startswith($prefix)))
              | .tagName | select(ltrimstr($prefix) | test("^[0-9]+-[0-9]+$"))]
              | sort_by(ltrimstr($prefix) | split("-") | map(tonumber)) | reverse | .[5:][]' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
