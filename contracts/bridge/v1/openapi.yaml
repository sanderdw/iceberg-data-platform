components:
  schemas:
    AutomationInput:
      properties:
        environment:
          type: string
          enum:
          - development
          - acceptance
          - production
          title: Environment
      additionalProperties: false
      type: object
      required:
      - environment
      title: AutomationInput
    AutomationList:
      properties:
        automationPrincipals:
          items:
            $ref: '#/components/schemas/AutomationPrincipal'
          type: array
          title: Automationprincipals
      type: object
      required:
      - automationPrincipals
      title: AutomationList
    AutomationPrincipal:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        team:
          type: string
          title: Team
        environment:
          type: string
          enum:
          - development
          - acceptance
          - production
          title: Environment
        extension:
          type: string
          title: Extension
        status:
          type: string
          enum:
          - active
          - revoking
          title: Status
        createdAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdat
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
      type: object
      required:
      - id
      - name
      - team
      - environment
      - extension
      - status
      - createdAt
      - createdBy
      title: AutomationPrincipal
    AutomationPrincipalDeleted:
      properties:
        deleted:
          type: boolean
          title: Deleted
        automationPrincipal:
          type: string
          title: Automationprincipal
      type: object
      required:
      - deleted
      - automationPrincipal
      title: AutomationPrincipalDeleted
    AutomationScope:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        team:
          type: string
          title: Team
        environment:
          type: string
          enum:
          - development
          - acceptance
          - production
          title: Environment
        extension:
          type: string
          title: Extension
        status:
          type: string
          enum:
          - active
          - revoking
          title: Status
        createdAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdat
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
        databases:
          items:
            $ref: '#/components/schemas/ScopedDatabase'
          type: array
          title: Databases
        sharedDatabases:
          items:
            $ref: '#/components/schemas/ScopedSharedDatabase'
          type: array
          title: Shareddatabases
      type: object
      required:
      - id
      - name
      - team
      - environment
      - extension
      - status
      - createdAt
      - createdBy
      - databases
      - sharedDatabases
      title: AutomationScope
    CatalogEndpoints:
      properties:
        uri:
          type: string
          title: Uri
        internalUri:
          type: string
          title: Internaluri
        tokenUri:
          type: string
          title: Tokenuri
      type: object
      required:
      - uri
      - internalUri
      - tokenUri
      title: CatalogEndpoints
    Column:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        required:
          type: boolean
          title: Required
        doc:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc
        children:
          items:
            $ref: '#/components/schemas/Column'
          type: array
          title: Children
      type: object
      required:
      - id
      - name
      - type
      - required
      - doc
      - children
      title: Column
    ContextRow:
      properties:
        label:
          type: string
          title: Label
        value:
          type: string
          title: Value
      type: object
      required:
      - label
      - value
      title: ContextRow
    Database:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        team:
          type: string
          title: Team
        environment:
          type: string
          enum:
          - development
          - acceptance
          - production
          title: Environment
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - name
      - team
      - environment
      - status
      title: Database
    Discovery:
      properties:
        contractVersion:
          type: string
          title: Contractversion
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        catalog:
          $ref: '#/components/schemas/CatalogEndpoints'
        storage:
          $ref: '#/components/schemas/StorageEndpoints'
        oidc:
          $ref: '#/components/schemas/OIDCEndpoints'
        environments:
          items:
            type: string
          type: array
          title: Environments
        network:
          $ref: '#/components/schemas/Network'
        userPortalUrl:
          type: string
          title: Userportalurl
        userPortalPages:
          items:
            $ref: '#/components/schemas/PortalPage'
          type: array
          title: Userportalpages
        extensions:
          items:
            $ref: '#/components/schemas/Extension'
          type: array
          title: Extensions
      type: object
      required:
      - contractVersion
      - capabilities
      - catalog
      - storage
      - oidc
      - environments
      - network
      - userPortalUrl
      - userPortalPages
      - extensions
      title: Discovery
    Error:
      properties:
        error:
          type: string
          title: Error
        code:
          type: string
          enum:
          - invalid_request
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - platform_error
          - unavailable
          - internal_error
          - unknown_extension
          - not_linked
          - user_required
          - service_required
          - listing_not_enabled
          - not_a_member
          - forbidden_role
          - no_teams
          - extension_not_enabled
          - unknown_automation_principal
          - unknown_listing
          title: Code
      type: object
      required:
      - error
      - code
      title: Error
    Expression:
      properties:
        dialect:
          type: string
          title: Dialect
        expression:
          type: string
          title: Expression
      type: object
      required:
      - dialect
      - expression
