      security:
      - KeycloakBearer: []
  /bridge/v1/listings/{listing}:
    get:
      summary: One listing with the metadata of its objects (listing extensions)
      operationId: getListing
      parameters:
      - name: listing
        in: path
        required: true
        schema:
          type: string
          pattern: ^share-[a-f0-9]{32}$
          title: Listing
      - name: if-none-match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-None-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '405':
          content:
