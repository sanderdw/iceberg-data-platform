[project]
name = "iceberg-conversationalbi"
version = "0.1.4"
description = "Conversational BI for the Iceberg Data Platform: ask questions of your own and shared semantic models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.53.0",
  "httpx>=0.28.1",
  "joserfc>=1.7.7",
  "mcp>=2.3.0,<3",
  "sqlglot>=30.25.0",
  "pyyaml>=6.0.3",
  "duckdb==2.0.0",
  "pydantic-ai-slim[ag-ui,spec,google,openai,anthropic,bedrock,bedrock-mantle,openrouter]>=2.62.0,<3",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.3"]

[tool.iceberg-conversationalbi]
# Bridge contract versions this release supports (contracts/bridge/COMPATIBILITY.md in the core).
# Shared semantic models need the `shared-data` capability; without it only your teams' own models appear.
bridge-contract = ">=0.1,<0.2"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "C4", "RUF"]
ignore = ["RUF001", "RUF002"]
