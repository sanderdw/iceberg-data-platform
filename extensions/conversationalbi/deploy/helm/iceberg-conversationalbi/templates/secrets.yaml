{{- $live := lookup "v1" "Secret" .Release.Namespace "iceberg-conversationalbi" -}}
# The key that identifies the runtime to the gateway's agent listener; generated once and kept.
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-conversationalbi
  labels:
    {{- include "cbi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  RUNTIME_KEY: {{ (($live).data).RUNTIME_KEY | default (randAlphaNum 48 | b64enc) }}
{{- if not .Values.llm.existingSecret }}
---
# LLM_MODEL and its provider's credentials, for the gateway only (llm.env on Docker).
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-conversationalbi-llm
  labels:
    {{- include "cbi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.llm.model }}{{ fail "Set llm.model (and its provider's key in llm.env), or llm.existingSecret" }}{{ end }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  {{- range $key, $value := .Values.llm.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
