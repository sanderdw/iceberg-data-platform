    "/api/v1/semantic-models/describe": {
      "get": {
        "summary": "A model's datasets, fields, metrics and the dimensions each metric can be split by",
        "operationId": "describeSemanticModel",
        "parameters": [
          {
            "name": "database",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          },
          {
            "name": "namespace",
            "in": "query",
            "required": true,
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              },
              "minItems": 1,
              "maxItems": 20,
              "description": "Namespace levels in order; repeat the parameter for nested levels.",
              "title": "Namespace"
            },
            "description": "Namespace levels in order; repeat the parameter for nested levels."
          },
          {
            "name": "model",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,256}$",
              "description": "The semantic model's name.",
              "title": "Model"
            },
            "description": "The semantic model's name."
