          "name": {
            "type": "string",
            "title": "Name"
          }
        },
        "type": "object",
        "required": [
          "id",
          "name"
        ],
        "title": "DatabaseName"
      },
      "Dimension": {
        "properties": {
          "field": {
            "type": "string",
