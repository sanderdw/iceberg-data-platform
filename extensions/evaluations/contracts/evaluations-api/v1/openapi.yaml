    "/api/v1/question-sets/{questionSet}": {
      "get": {
        "summary": "A question set with its cases (YAML), versions, schedules and latest runs",
        "operationId": "getQuestionSet",
        "parameters": [
          {
            "name": "questionSet",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^qs-[a-f0-9]{24}$",
              "title": "Questionset"
            }
          },
          {
            "name": "version",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "integer",
                  "minimum": 1
                },
                {
                  "type": "null"
                }
              ],
              "description": "An older version.",
              "title": "Version"
            },
            "description": "An older version."
          }
        ],
        "responses": {
