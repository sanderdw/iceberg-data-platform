  },
  "components": {
    "schemas": {
      "CompareInput": {
        "properties": {
          "llm_models": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 5,
            "minItems": 2,
            "title": "Llm Models"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "llm_models"
        ],
        "title": "CompareInput"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ImportInput": {
        "properties": {
          "questions_sql": {
            "type": "string",
            "maxLength": 500000,
            "title": "Questions Sql",
            "description": "A semantic model's <name>.questions.sql: `-- Q:` lines with a `-- query_semantic_model:` line each."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "questions_sql"
        ],
        "title": "ImportInput"
      },
      "LiveInput": {
        "properties": {
          "enabled": {
            "type": "boolean",
            "title": "Enabled"
          },
          "sample_pct": {
            "type": "integer",
            "maximum": 100.0,
            "minimum": 1.0,
            "title": "Sample Pct",
            "description": "Share of new conversations scored.",
            "default": 20
          },
          "cron": {
            "type": "string",
            "maxLength": 100,
            "title": "Cron",
            "description": "When to check, five-field cron in UTC.",
            "default": "0 * * * *"
          },
          "target_database": {
            "type": "string",
            "pattern": "^(db-[a-f0-9]{32})?$",
            "title": "Target Database",
            "description": "The team database the scores go to as evaluations.live_scores; empty for none.",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "enabled"
        ],
        "title": "LiveInput"
      },
      "ModelRef": {
        "properties": {
          "database": {
            "type": "string",
            "pattern": "^db-[a-f0-9]{32}$",
            "title": "Database"
          },
          "namespace": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 20,
            "minItems": 1,
            "title": "Namespace"
          },
          "name": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,256}$",
            "title": "Name"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "database",
          "namespace",
          "name"
        ],
        "title": "ModelRef"
      },
      "PromoteInput": {
        "properties": {
          "question_set": {
            "type": "string",
            "pattern": "^qs-[a-f0-9]{24}$",
            "title": "Question Set"
          },
          "name": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[a-z0-9][a-z0-9_-]{0,59}$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Name"
          },
          "expect": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Expect",
            "description": "query, refusal, clarify or decline; by default the query the agent ran."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "question_set"
        ],
        "title": "PromoteInput"
      },
      "QuestionSetInput": {
        "properties": {
          "id": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^qs-[a-f0-9]{24}$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Id",
            "description": "Leave out to create one."
          },
          "team": {
            "type": "string",
            "pattern": "^(team-[a-f0-9]{32})?$",
            "title": "Team",
            "description": "For a new question set.",
            "default": ""
          },
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment",
            "default": "development"
          },
          "name": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[a-z][a-z0-9_-]{2,47}$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Name"
          },
          "description": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 500
              },
              {
                "type": "null"
              }
            ],
            "title": "Description"
          },
          "model": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/ModelRef"
              },
              {
                "type": "null"
              }
            ],
            "description": "The semantic model the expected queries run on."
          },
          "yaml": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 500000
              },
              {
                "type": "null"
              }
            ],
            "title": "Yaml",
            "description": "The cases as pydantic-evals YAML; a change is a new version. See get_question_set for the format."
          },
          "rubric": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 2000
              },
              {
                "type": "null"
              }
            ],
            "title": "Rubric",
            "description": "What the LLM judge looks for."
          },
          "target_database": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^(db-[a-f0-9]{32})?$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Target Database",
            "description": "The team database the results go to as Iceberg tables; empty for none."
          },
          "note": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200
              },
              {
                "type": "null"
              }
            ],
            "title": "Note",
            "description": "Why this version, for its history."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "QuestionSetInput"
      },
      "ReviewInput": {
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "dismiss",
              "reopen"
            ],
            "title": "Action"
          },
          "note": {
            "type": "string",
            "maxLength": 500,
            "title": "Note",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "action"
        ],
        "title": "ReviewInput"
      },
      "RunInput": {
        "properties": {
          "llm_model": {
            "type": "string",
            "maxLength": 200,
            "title": "Llm Model",
            "description": "An LLM the agent should answer with, from list_agent_models' llmModels; empty for its default.",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "RunInput"
      },
      "ScheduleInput": {
        "properties": {
          "cron": {
            "type": "string",
            "maxLength": 100,
            "title": "Cron",
            "description": "Five-field cron in UTC, such as '0 6 * * 1'."
          },
          "llm_model": {
            "type": "string",
            "maxLength": 200,
            "title": "Llm Model",
            "description": "An LLM the agent should answer with, from list_agent_models' llmModels; empty for its default.",
            "default": ""
          },
          "enabled": {
            "type": "boolean",
            "title": "Enabled",
            "default": true
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "cron"
        ],
        "title": "ScheduleInput"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
