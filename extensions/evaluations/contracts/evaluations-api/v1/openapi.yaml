  "components": {
    "schemas": {
      "AgentModels": {
        "properties": {
          "semanticModels": {
            "items": {
              "$ref": "#/components/schemas/AgentSemanticModel"
            },
            "type": "array",
            "title": "Semanticmodels"
          },
          "llmModels": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Llmmodels",
            "description": "The LLMs a run may choose."
          },
          "schemaOnly": {
            "type": "boolean",
            "title": "Schemaonly",
            "description": "Whether measure_semantic_model's control arm is allowed."
          }
        },
        "type": "object",
        "required": [
          "semanticModels",
          "llmModels",
          "schemaOnly"
        ],
        "title": "AgentModels"
      },
      "AgentSemanticModel": {
        "properties": {
          "model": {
            "$ref": "#/components/schemas/SemanticModel",
            "description": "The reference a question set takes as its model."
          },
          "name": {
            "type": "string",
            "title": "Name"
          },
          "databaseName": {
            "type": "string",
            "title": "Databasename"
          },
          "environment": {
            "type": "string",
            "title": "Environment"
          },
          "shared": {
            "type": "boolean",
            "title": "Shared",
            "description": "Shared with the team by another team."
          }
        },
        "type": "object",
        "required": [
          "model",
          "name",
          "databaseName",
          "environment",
          "shared"
        ],
        "title": "AgentSemanticModel"
      },
      "Apps": {
        "properties": {
          "workspace": {
            "items": {
              "$ref": "#/components/schemas/WorkspacePage"
            },
            "type": "array",
            "title": "Workspace"
          },
          "extensions": {
            "items": {
              "$ref": "#/components/schemas/ExtensionLink"
            },
            "type": "array",
            "title": "Extensions"
          }
        },
        "type": "object",
        "required": [
          "workspace",
          "extensions"
        ],
        "title": "Apps"
      },
      "CaseResult": {
        "properties": {
          "name": {
            "type": "string",
            "title": "Name"
          },
          "question": {
            "type": "string",
            "title": "Question"
          },
          "kind": {
            "type": "string",
            "enum": [
              "query",
              "refusal",
              "clarify",
              "decline"
            ],
            "title": "Kind"
          },
          "tags": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Tags"
          },
          "passed": {
            "type": "boolean",
            "title": "Passed"
          },
          "scores": {
            "additionalProperties": {
              "$ref": "#/components/schemas/Score"
            },
            "type": "object",
            "title": "Scores"
          },
          "answer": {
            "type": "string",
            "title": "Answer"
          },
          "queries": {
            "items": {
              "additionalProperties": true,
              "type": "object"
            },
