{
  "openapi": "3.1.0",
  "info": {
    "title": "Ingestion (dlt) \u00b7 Iceberg Data Platform",
    "description": "Declarative dlt pipelines that load REST APIs, databases and files into your teams' Iceberg databases, with runs and schedules. Authenticate with a Keycloak bearer token for the iceberg-bridge audience (client ext-ingestion-mcp), or sign in with the browser. Every operation is also an MCP tool at /mcp.",
    "version": "0.1.1"
  },
  "paths": {
    "/api/v1/me": {
      "get": {
        "summary": "Your teams, roles, databases and this extension",
        "operationId": "whoami",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
    "/api/v1/teams/{team}/environments": {
      "get": {
        "summary": "Where Ingestion is enabled for a team, with each environment's databases",
        "operationId": "listEnvironments",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/teams/{team}/environments/{environment}": {
      "post": {
        "summary": "Enable Ingestion for a team environment (team administrators)",
        "operationId": "enableEnvironment",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          },
          {
            "name": "environment",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "development",
                "acceptance",
                "production"
              ],
              "type": "string",
              "title": "Environment"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      },
      "delete": {
        "summary": "Disable Ingestion for a team environment (team administrators)",
        "operationId": "disableEnvironment",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          },
          {
            "name": "environment",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "development",
                "acceptance",
                "production"
              ],
              "type": "string",
              "title": "Environment"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
