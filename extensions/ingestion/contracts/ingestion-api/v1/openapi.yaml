              }
            }
          }
        }
      },
      "delete": {
        "summary": "Remove a pipeline's schedule (team administrators)",
        "operationId": "deleteSchedule",
        "parameters": [
          {
            "name": "pipeline",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^pl-[a-f0-9]{24}$",
              "title": "Pipeline"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "DeleteInput": {
        "properties": {
          "confirm_name": {
            "type": "string",
            "maxLength": 64,
            "title": "Confirm Name"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "confirm_name"
        ],
        "title": "DeleteInput"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "PipelineChange": {
        "properties": {
          "sourceType": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "rest_api",
                  "sql_database",
                  "filesystem"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Sourcetype"
          },
          "source": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source",
            "description": "The source definition for the source type, as list_templates shows it. Secret values never go here: refer to them as \"$secret:<name>\" and set them with set_pipeline_secrets."
          },
          "resources": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Resources",
            "description": "Per resource (endpoint, table or file): writeDisposition append, replace or merge (merge needs primaryKey), and partition columns."
          },
          "name": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ],
            "title": "Name"
          },
          "description": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 500
              },
              {
                "type": "null"
              }
            ],
            "title": "Description"
          },
          "database": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ],
            "title": "Database"
          },
          "namespace": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ],
            "title": "Namespace"
          },
          "expected_revision": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Expected Revision",
            "description": "Fail if the pipeline changed since this revision."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "PipelineChange"
      },
      "PipelineInput": {
        "properties": {
          "sourceType": {
            "type": "string",
            "enum": [
              "rest_api",
              "sql_database",
              "filesystem"
            ],
            "title": "Sourcetype"
          },
          "source": {
            "additionalProperties": true,
            "type": "object",
            "title": "Source",
            "description": "The source definition for the source type, as list_templates shows it. Secret values never go here: refer to them as \"$secret:<name>\" and set them with set_pipeline_secrets."
          },
          "resources": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Resources",
            "description": "Per resource (endpoint, table or file): writeDisposition append, replace or merge (merge needs primaryKey), and partition columns."
          },
          "team": {
            "type": "string",
            "pattern": "^team-[a-f0-9]{32}$",
            "title": "Team"
          },
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment",
            "default": "development"
          },
          "name": {
            "type": "string",
            "maxLength": 64,
            "title": "Name",
            "description": "Up to 64 letters, digits, spaces, '.', '_' or '-'."
          },
          "description": {
            "type": "string",
            "maxLength": 500,
            "title": "Description",
            "default": ""
          },
          "database": {
            "type": "string",
            "maxLength": 100,
            "title": "Database",
            "description": "A team database in this environment, by id or name."
          },
          "namespace": {
            "type": "string",
            "maxLength": 64,
            "title": "Namespace",
            "description": "Where tables land, such as raw_crm (dlt's dataset)."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "sourceType",
          "source",
          "team",
          "name",
          "database",
          "namespace"
        ],
        "title": "PipelineInput"
      },
      "RunInput": {
        "properties": {
          "full_refresh": {
            "type": "boolean",
            "title": "Full Refresh",
            "description": "Load everything again: ignore incremental state and replace the tables' rows.",
            "default": false
          },
          "wait": {
            "type": "integer",
            "maximum": 600.0,
            "minimum": 0.0,
            "title": "Wait",
            "description": "Seconds to wait for the run to finish.",
            "default": 0
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "RunInput"
      },
      "ScheduleInput": {
        "properties": {
          "cron": {
            "type": "string",
            "maxLength": 100,
            "title": "Cron",
            "description": "Five-field cron expression in UTC, at most every 5 minutes."
          },
          "enabled": {
            "type": "boolean",
            "title": "Enabled",
            "default": true
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "cron"
        ],
