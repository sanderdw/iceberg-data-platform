    },
    "/api/v1/runs/{run}/logs": {
      "get": {
        "summary": "A run's log, with secrets masked",
        "operationId": "getRunLogs",
        "parameters": [
          {
            "name": "run",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^run-[a-f0-9]{24}$",
              "title": "Run"
            }
          },
          {
            "name": "tail",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 5000,
              "minimum": 1,
              "default": 500,
              "title": "Tail"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/runs/{run}/cancel": {
      "post": {
        "summary": "Stop a run (writers)",
        "operationId": "cancelRun",
        "parameters": [
          {
            "name": "run",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^run-[a-f0-9]{24}$",
              "title": "Run"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/pipelines/{pipeline}/schedule": {
      "put": {
        "summary": "Run a pipeline on a cron schedule in UTC (team administrators)",
        "operationId": "setSchedule",
        "parameters": [
          {
            "name": "pipeline",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^pl-[a-f0-9]{24}$",
              "title": "Pipeline"
            }
          }
        ],
        "requestBody": {
          "required": true,
