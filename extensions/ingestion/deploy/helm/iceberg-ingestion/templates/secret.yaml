{{- /* The launcher token and the key that encrypts stored source credentials, generated once and kept:
a new ING_SECRET_KEY would make every stored source password unreadable. */ -}}
{{- $live := lookup "v1" "Secret" .Release.Namespace "iceberg-ingestion" -}}
{{- if and .Release.IsUpgrade (not $live) -}}
{{- fail "Secret iceberg-ingestion is missing. Restore it before upgrading." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-ingestion
  labels:
    {{- include "ing.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  LAUNCHER_TOKEN: {{ (($live).data).LAUNCHER_TOKEN | default (randAlphaNum 48 | b64enc) }}
  # 32 bytes as hex, as scripts/setup.py writes it (ingestion/secrets.py).
  ING_SECRET_KEY: {{ (($live).data).ING_SECRET_KEY | default (randAlphaNum 64 | sha256sum | b64enc) }}
