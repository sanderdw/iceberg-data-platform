[project]
name = "iceberg-openmetadata"
version = "0.1.2"
description = "OpenMetadata for the Iceberg Data Platform: publishes listed data shares (schemas, descriptions and semantic model metrics, never data) to an OpenMetadata catalog"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.53.0",
  "httpx>=0.28.1",
]

[dependency-groups]
# OpenTelemetry export, used only when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = [
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-httpx>=0.66b1",
  "opentelemetry-instrumentation-logging>=0.66b1",
]
dev = [
  {include-group = "otel"},
  "pytest>=9.1.1",
  "ruff>=0.17.3",
]

[tool.iceberg-openmetadata]
# Bridge contract versions this release supports (contracts/bridge/COMPATIBILITY.md in the core).
# 0.1.1 is the first with the `listings` capability.
bridge-contract = ">=0.1.1,<0.2"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "C4", "RUF"]
ignore = ["RUF001", "RUF002"]
