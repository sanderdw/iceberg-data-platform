# The Replication extension, installed in the platform's namespace after the platform chart registered it:
#   helm upgrade iceberg <platform chart> --reuse-values --set extensions.replication.host=replicate
#   helm install replication <this chart> -n <platform namespace>
image:
  registry: ghcr.io/sanderdw
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
images:
  portal: iceberg-replication
  runner: iceberg-replication-runner

# The handshake Secret the platform chart writes for this extension.
bridgeSecret: iceberg-bridge-replication
clusterDomain: cluster.local

ingress:
  enabled: true
  # The platform's ingress settings; the host comes from EXTENSION_ORIGIN in the handshake.
  host: ""
  className: ""
  annotations: {}
tls:
  clusterIssuer: ""
  secretName: iceberg-replication-tls

runs:
  maxConcurrent: 4
  maxPerTeam: 2
  retention: 30
  timeoutSeconds: 43200
  # OLake's Go reader and Java writer; a large burst of changes needs more (DECISIONS.md).
  memory: 4g
  cpus: "2"
  workSize: 4Gi
  # Private networks where your operational databases live, such as [10.20.0.0/16]: runs may reach them,
  # in the gateway's address check and in the runs' NetworkPolicy.
  allowedSourceNetworks: []
  # Every private address (demos only). Off: runs reach public sources and allowedSourceNetworks.
  allowPrivateSources: false

storage:
  state: 5Gi
  artifacts: 10Gi
storageClass: ""

# OpenTelemetry: the extension's service sends its logs and traces over OTLP/HTTP when an endpoint is
# set, as the platform's chart does (otel.* there).
otel:
  endpoint: ""  # e.g. http://otel-collector.observability:4318
  # A Secret in this namespace with the key OTEL_EXPORTER_OTLP_HEADERS, for a backend that needs an API key.
  headersSecret: ""
  resourceAttributes: ""

networkPolicy:
  enabled: true
