      "get": {
        "summary": "Where Replication is enabled for a team, with each environment's databases",
        "operationId": "listEnvironments",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
