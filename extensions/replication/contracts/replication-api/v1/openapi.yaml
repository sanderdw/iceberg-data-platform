  "components": {
    "schemas": {
      "DeleteInput": {
        "properties": {
          "confirm_name": {
            "type": "string",
            "maxLength": 64,
            "title": "Confirm Name"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "confirm_name"
        ],
        "title": "DeleteInput"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ReplicationChange": {
        "properties": {
          "sourceType": {
            "anyOf": [
              {
                "type": "string",
                "const": "postgres"
              },
              {
                "type": "null"
              }
            ],
            "title": "Sourcetype"
          },
          "source": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source",
            "description": "The source connection for the source type, as list_templates shows it: host, port, database, username, password, tls, and slot and publication for change data capture. Secret values never go here: refer to them as \"$secret:<name>\" and set them with set_replication_secrets."
          },
          "tables": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Tables",
            "description": "Source tables keyed by schema.table: mode cdc (change data capture), incremental (needs cursor) or full_refresh; optional table (the Iceberg table name), partition (such as \"/{created_at,month}\") and appendOnly (for tables without a primary key)."
          },
          "options": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Options",
            "description": "deleteMode pos (positional deletes, default) or dv (deletion vectors, Iceberg v3); firstRun copy (existing rows, then changes; default) or changes (only changes from now on)."
          },
          "name": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ],
            "title": "Name"
          },
          "description": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 500
              },
              {
                "type": "null"
              }
            ],
            "title": "Description"
          },
          "database": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ],
            "title": "Database"
          },
          "namespace": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ],
            "title": "Namespace"
          },
          "expected_revision": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Expected Revision",
            "description": "Fail if the replication changed since this revision."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "ReplicationChange"
      },
      "ReplicationInput": {
        "properties": {
          "sourceType": {
            "type": "string",
            "const": "postgres",
            "title": "Sourcetype"
          },
          "source": {
            "additionalProperties": true,
            "type": "object",
            "title": "Source",
            "description": "The source connection for the source type, as list_templates shows it: host, port, database, username, password, tls, and slot and publication for change data capture. Secret values never go here: refer to them as \"$secret:<name>\" and set them with set_replication_secrets."
          },
          "tables": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Tables",
            "description": "Source tables keyed by schema.table: mode cdc (change data capture), incremental (needs cursor) or full_refresh; optional table (the Iceberg table name), partition (such as \"/{created_at,month}\") and appendOnly (for tables without a primary key)."
          },
          "options": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Options",
            "description": "deleteMode pos (positional deletes, default) or dv (deletion vectors, Iceberg v3); firstRun copy (existing rows, then changes; default) or changes (only changes from now on)."
          },
          "team": {
            "type": "string",
            "pattern": "^team-[a-f0-9]{32}$",
            "title": "Team"
          },
          "environment": {
            "type": "string",
            "enum": [
              "development",
              "acceptance",
              "production"
            ],
            "title": "Environment",
            "default": "development"
          },
          "name": {
            "type": "string",
            "maxLength": 64,
            "title": "Name",
            "description": "Up to 64 letters, digits, spaces, '.', '_' or '-'."
          },
          "description": {
            "type": "string",
            "maxLength": 500,
            "title": "Description",
            "default": ""
          },
          "database": {
            "type": "string",
            "maxLength": 100,
            "title": "Database",
            "description": "A team database in this environment, by id or name."
          },
          "namespace": {
            "type": "string",
            "maxLength": 64,
            "title": "Namespace",
            "description": "Where tables land, such as raw_crm."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "sourceType",
          "source",
          "team",
          "name",
          "database",
          "namespace"
        ],
        "title": "ReplicationInput"
      },
      "RunInput": {
        "properties": {
          "full_refresh": {
            "type": "boolean",
            "title": "Full Refresh",
            "description": "Copy everything again: start without the saved change log position. Rows are upserted on their key.",
            "default": false
          },
          "wait": {
            "type": "integer",
            "maximum": 600.0,
            "minimum": 0.0,
            "title": "Wait",
            "description": "Seconds to wait for the run to finish.",
            "default": 0
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "RunInput"
      },
      "ScheduleInput": {
        "properties": {
          "cron": {
            "type": "string",
            "maxLength": 100,
            "title": "Cron",
            "description": "Five-field cron expression in UTC, at most every 5 minutes."
          },
          "enabled": {
            "type": "boolean",
            "title": "Enabled",
            "default": true
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "cron"
        ],
        "title": "ScheduleInput"
      },
      "SecretsInput": {
        "properties": {
          "secrets": {
            "additionalProperties": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            },
            "type": "object",
            "title": "Secrets",
            "description": "Secret name \u2192 value, or null to remove it. Write-only."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "secrets"
        ],
        "title": "SecretsInput"
      },
      "ValidateInput": {
        "properties": {
          "sourceType": {
            "anyOf": [
              {
                "type": "string",
                "const": "postgres"
              },
              {
                "type": "null"
              }
            ],
            "title": "Sourcetype"
          },
          "source": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source",
            "description": "The source connection for the source type, as list_templates shows it: host, port, database, username, password, tls, and slot and publication for change data capture. Secret values never go here: refer to them as \"$secret:<name>\" and set them with set_replication_secrets."
          },
          "tables": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Tables",
            "description": "Source tables keyed by schema.table: mode cdc (change data capture), incremental (needs cursor) or full_refresh; optional table (the Iceberg table name), partition (such as \"/{created_at,month}\") and appendOnly (for tables without a primary key)."
          },
          "options": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Options",
            "description": "deleteMode pos (positional deletes, default) or dv (deletion vectors, Iceberg v3); firstRun copy (existing rows, then changes; default) or changes (only changes from now on)."
          },
          "team": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^team-[a-f0-9]{32}$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Team"
          },
          "environment": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "development",
                  "acceptance",
                  "production"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Environment"
          },
          "database": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ],
            "title": "Database"
          },
          "namespace": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ],
            "title": "Namespace"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "ValidateInput"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
