{
  "openapi": "3.1.0",
  "info": {
    "title": "Replication (OLake) \u00b7 Iceberg Data Platform",
    "description": "Replications that keep operational databases in step with your teams' Iceberg databases with OLake (change data capture), with source checks, runs and schedules. Authenticate with a Keycloak bearer token for the iceberg-bridge audience (client ext-replication-mcp), or sign in with the browser. Every operation is also an MCP tool at /mcp.",
    "version": "0.0.1"
  },
  "paths": {
    "/api/v1/me": {
      "get": {
        "summary": "Your teams, roles, databases and this extension",
        "operationId": "whoami",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
