{{- /* The launcher token, generated once and kept like the platform's credentials. */ -}}
{{- $live := lookup "v1" "Secret" .Release.Namespace "iceberg-dbt" -}}
{{- if and .Release.IsUpgrade (not $live) -}}
{{- fail "Secret iceberg-dbt is missing. Restore it before upgrading." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-dbt
  labels:
    {{- include "dbt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  LAUNCHER_TOKEN: {{ (($live).data).LAUNCHER_TOKEN | default (randAlphaNum 48 | b64enc) }}
