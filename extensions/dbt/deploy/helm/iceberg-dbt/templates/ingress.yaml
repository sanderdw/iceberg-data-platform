{{- if .Values.ingress.enabled }}
{{- $host := include "dbt.host" . }}
{{- if not $host }}{{ fail "Register dbt in the platform chart first (extensions.dbt), or set ingress.host" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iceberg-dbt
  labels:
    {{- include "dbt.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - secretName: {{ .Values.tls.secretName }}
      hosts: [{{ $host }}]
  rules:
    - host: {{ $host }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: dbt-portal, port: {number: 3004}}}}
{{- end }}
