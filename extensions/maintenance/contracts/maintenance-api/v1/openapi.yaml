{
  "openapi": "3.1.0",
  "info": {
    "title": "Maintenance \u00b7 Iceberg Data Platform",
    "description": "Table maintenance for your teams' Iceberg databases (beta): snapshot expiry, compaction, dangling deletes, manifests and orphan files, by policy and schedule. Authenticate with a Keycloak bearer token for the iceberg-bridge audience (client ext-maintenance-mcp), or sign in with the browser. Every operation is also an MCP tool at /mcp.",
    "version": "0.0.1"
  },
  "paths": {
    "/api/v1/me": {
      "get": {
        "summary": "Your teams, roles, databases, the policy defaults and this extension",
        "operationId": "whoami",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
    "/api/v1/teams/{team}/environments": {
      "get": {
        "summary": "Where Maintenance is enabled for a team, with each environment's databases",
        "operationId": "listEnvironments",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/teams/{team}/environments/{environment}": {
      "post": {
        "summary": "Enable Maintenance for a team environment (team administrators)",
        "operationId": "enableEnvironment",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          },
          {
            "name": "environment",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "development",
                "acceptance",
                "production"
              ],
              "type": "string",
              "title": "Environment"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      },
      "delete": {
        "summary": "Disable Maintenance for a team environment (team administrators)",
        "operationId": "disableEnvironment",
        "parameters": [
          {
            "name": "team",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^team-[a-f0-9]{32}$",
              "title": "Team"
            }
          },
          {
            "name": "environment",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "development",
                "acceptance",
                "production"
              ],
              "type": "string",
              "title": "Environment"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/databases": {
      "get": {
        "summary": "Your teams' databases with their policy, schedule, last run and tables that need attention",
        "operationId": "listDatabases",
        "parameters": [
          {
            "name": "team",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string",
                  "pattern": "^team-[a-f0-9]{32}$"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Team"
            }
          },
          {
            "name": "environment",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "enum": [
                    "development",
                    "acceptance",
                    "production"
                  ],
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Environment"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/tables": {
      "get": {
        "summary": "Table health from the last runs, with what needs attention",
        "operationId": "listTables",
        "parameters": [
          {
            "name": "database",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string",
                  "pattern": "^db-[a-f0-9]{32}$"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Database"
            }
          },
          {
            "name": "team",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string",
                  "pattern": "^team-[a-f0-9]{32}$"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Team"
            }
          },
          {
            "name": "environment",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "enum": [
                    "development",
                    "acceptance",
                    "production"
                  ],
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Environment"
            }
          },
          {
            "name": "attention",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false,
              "title": "Attention"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/databases/{database}/tables/{table}": {
      "get": {
        "summary": "One table's health, its last actions, effective policy and recent runs",
        "operationId": "getTable",
        "parameters": [
          {
            "name": "database",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          },
          {
            "name": "table",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_$-][A-Za-z0-9_.$-]{1,298}[A-Za-z0-9_$-]$",
              "description": "namespace.table",
              "title": "Table"
            },
            "description": "namespace.table"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/databases/{database}/policy": {
      "get": {
        "summary": "A database's maintenance policy and schedule, or the defaults when it has none",
        "operationId": "getPolicy",
        "parameters": [
          {
            "name": "database",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      },
      "put": {
        "summary": "Create or change a database's policy and schedule (team administrators)",
        "operationId": "setPolicy",
        "parameters": [
          {
            "name": "database",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PolicyInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      },
      "delete": {
        "summary": "Remove a database's policy and schedule (team administrators)",
        "operationId": "deletePolicy",
        "parameters": [
          {
            "name": "database",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/databases/{database}/runs": {
      "post": {
        "summary": "Inspect, dry-run or maintain a database now (writers)",
        "operationId": "runMaintenance",
        "parameters": [
          {
            "name": "database",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "anyOf": [
                  {
                    "$ref": "#/components/schemas/RunInput"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Data"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      },
      "get": {
        "summary": "A database's runs, newest first",
        "operationId": "listRuns",
        "parameters": [
          {
            "name": "database",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^db-[a-f0-9]{32}$",
              "title": "Database"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 200,
              "minimum": 1,
              "default": 20,
              "title": "Limit"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/runs/{run}": {
      "get": {
        "summary": "A run with its totals and each table's actions",
        "operationId": "getRun",
        "parameters": [
          {
            "name": "run",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^run-[a-f0-9]{24}$",
              "title": "Run"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/runs/{run}/logs": {
      "get": {
        "summary": "A run's log",
        "operationId": "getRunLogs",
        "parameters": [
          {
            "name": "run",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^run-[a-f0-9]{24}$",
              "title": "Run"
            }
          },
          {
            "name": "tail",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 5000,
              "minimum": 1,
              "default": 500,
              "title": "Tail"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/runs/{run}/cancel": {
      "post": {
        "summary": "Stop a run (writers)",
        "operationId": "cancelRun",
        "parameters": [
          {
            "name": "run",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^run-[a-f0-9]{24}$",
              "title": "Run"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "PolicyInput": {
        "properties": {
          "settings": {
            "anyOf": [
              {
                "additionalProperties": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Settings",
            "description": "Per operation (expireSnapshots, compaction, orphanFiles, rewriteManifests, danglingDeletes), the settings to change; the rest keeps its value. whoami lists the defaults."
          },
          "exclude": {
            "anyOf": [
              {
                "items": {
                  "type": "string"
                },
                "type": "array",
                "maxItems": 500
              },
              {
                "type": "null"
              }
            ],
            "title": "Exclude",
            "description": "Tables (namespace.table) that maintenance leaves alone."
          },
          "cron": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ],
            "title": "Cron",
            "description": "Five-field cron expression in UTC, at most once an hour; empty removes the schedule."
          },
          "scheduleEnabled": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "null"
              }
            ],
            "title": "Scheduleenabled",
            "description": "Pause or resume the schedule."
          },
          "expected_revision": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Expected Revision",
            "description": "Fail if the policy changed since this revision (0: only if there is none yet)."
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "PolicyInput"
      },
      "RunInput": {
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "inspect",
              "dry-run",
              "maintain"
            ],
            "title": "Mode",
            "description": "inspect reads every table's health; dry-run plans the policy without changing anything; maintain applies it (needs a policy).",
            "default": "inspect"
          },
          "tables": {
            "anyOf": [
              {
                "items": {
                  "type": "string"
                },
                "type": "array",
                "maxItems": 200
              },
              {
                "type": "null"
              }
            ],
            "title": "Tables",
            "description": "Only these tables (namespace.table); all when empty."
          },
          "wait": {
            "type": "integer",
            "maximum": 600.0,
            "minimum": 0.0,
            "title": "Wait",
            "description": "Seconds to wait for the run to finish.",
            "default": 0
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "RunInput"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
