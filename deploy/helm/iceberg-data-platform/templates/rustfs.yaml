apiVersion: v1
kind: Service
metadata:
  name: rustfs
  labels:
    {{- include "idp.component" (list . "rustfs") | nindent 4 }}
spec:
  selector:
    {{- include "idp.selector" "rustfs" | nindent 4 }}
  ports:
    - {name: s3, port: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  labels:
    {{- include "idp.component" (list . "rustfs") | nindent 4 }}
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "idp.selector" "rustfs" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idp.component" (list . "rustfs") | nindent 8 }}
        io.iceberg-platform.role: storage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "idp.pullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rustfs
          image: {{ .Values.images.rustfs }}
          env:
            - name: RUSTFS_ACCESS_KEY
              value: {{ .Values.rustfsAccessKey | quote }}
            {{- include "idp.secretEnv" (list . "RUSTFS_SECRET_KEY") | nindent 12 }}
            - {name: RUSTFS_VOLUMES, value: /data/rustfs}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            # The console is never routed; it stays off.
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
          ports:
            - {name: s3, containerPort: 9000}
          {{- include "idp.probes" (list "/health" "s3" 15) | nindent 10 }}
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.storage }}
