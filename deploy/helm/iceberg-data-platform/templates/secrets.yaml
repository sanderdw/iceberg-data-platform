{{- /*
Credentials are generated once and kept: lookup returns the live Secret on every upgrade, and the
Secret survives helm uninstall. An upgrade that finds no Secret fails instead of rotating every
password (the data in Postgres and RustFS would no longer open).
*/ -}}
{{- $name := "iceberg-platform" -}}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($live).data | default dict -}}
{{- if and .Release.IsUpgrade (not $live) (not .Values.existingSecret) -}}
{{- fail (printf "Secret %s/%s is missing. Restore it, or set existingSecret, before upgrading." .Release.Namespace $name) -}}
{{- end -}}
{{- $values := dict -}}
{{- range $key := list "POSTGRES_PASSWORD" "KEYCLOAK_DB_PASSWORD" "POLARIS_CLIENT_SECRET" "RUSTFS_SECRET_KEY" "KEYCLOAK_ADMIN_PASSWORD" "OIDC_PORTAL_SECRET" "OIDC_USERS_SECRET" "OIDC_MANAGEMENT_SECRET" "PLATFORM_ADMIN_PASSWORD" "PORTAL_PASSWORD" -}}
{{- $_ := set $values $key (ternary (index $data $key | default "" | b64dec) (randAlphaNum 48) (hasKey $data $key)) -}}
{{- end -}}
{{- if .Values.demo -}}
{{- range $account := list "ADMIN" "WRITER" "READER" "OUTSIDER" -}}
{{- $key := printf "DEMO_%s_PASSWORD" $account -}}
{{- $_ := set $values $key (ternary (index $data $key | default "" | b64dec) (randAlphaNum 48) (hasKey $data $key)) -}}
{{- end -}}
{{- end -}}
{{- /* Extension client secrets: one per registered extension, kept like the others. */ -}}
{{- $extensionSecrets := list -}}
{{- range $id, $ext := .Values.extensions -}}
{{- $handshake := lookup "v1" "Secret" $.Release.Namespace (printf "iceberg-bridge-%s" $id) -}}
{{- $secret := ternary (index (($handshake).data | default dict) "BRIDGE_CLIENT_SECRET" | default "" | b64dec) (randAlphaNum 48) (hasKey (($handshake).data | default dict) "BRIDGE_CLIENT_SECRET") -}}
{{- $extensionSecrets = append $extensionSecrets (printf "%s=%s" $id $secret) -}}
{{- $origin := $ext.origin | default (printf "https://%s.%s" $ext.host $.Values.baseDomain) | trimSuffix "/" }}
---
# The extension's handshake (contracts/bridge/v1/handshake.md): its chart reads these keys.
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-bridge-{{ $id }}
  labels:
    {{- include "idp.labels" $ | nindent 4 }}
    io.iceberg-platform.extension: {{ $id }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  BRIDGE_CONTRACT: "1"
  BRIDGE_URL: http://bridge:3005
  BRIDGE_EXTENSION_ID: {{ $id | quote }}
  BRIDGE_CLIENT_ID: ext-{{ $id }}
  BRIDGE_CLIENT_SECRET: {{ $secret | quote }}
  BRIDGE_MCP_CLIENT_ID: ext-{{ $id }}-mcp
  OIDC_ISSUER: {{ include "idp.issuer" $ | quote }}
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/iceberg
  EXTENSION_ORIGIN: {{ $origin | quote }}
  MCP_CALLBACK_PORT: {{ $.Values.mcpCallbackPort | quote }}
  PLATFORM_NETWORK: {{ $.Release.Namespace | quote }}
{{- end }}
{{- if not .Values.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "idp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := $values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  PLATFORM_EXTENSION_SECRETS: {{ join "," $extensionSecrets | quote }}
  # Not secret, but the official Polaris chart reads both storage keys from one Secret.
  RUSTFS_ACCESS_KEY: {{ .Values.rustfsAccessKey | quote }}
{{- end }}
{{- if .Values.polaris.external.enabled }}
{{- /* The official Polaris chart reads its database login from one Secret: URL, user and password. */ -}}
{{- $password := "" -}}
{{- if include "idp.pgExternal" . -}}
{{- $pg := lookup "v1" "Secret" .Release.Namespace .Values.postgres.external.existingSecret -}}
{{- $password = index (($pg).data | default dict) "POLARIS_DB_PASSWORD" | default "" | b64dec -}}
{{- else if .Values.existingSecret -}}
{{- $own := lookup "v1" "Secret" .Release.Namespace .Values.existingSecret -}}
{{- $password = index (($own).data | default dict) "POSTGRES_PASSWORD" | default "" | b64dec -}}
{{- else -}}
{{- $password = $values.POSTGRES_PASSWORD -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-polaris-db
  labels:
    {{- include "idp.labels" . | nindent 4 }}
type: Opaque
stringData:
  jdbcUrl: "jdbc:postgresql://{{ include "idp.pgHost" . }}:{{ include "idp.pgPort" . }}/{{ include "idp.pgDatabase" (list . "polaris") }}?sslmode={{ include "idp.pgSslmode" . }}"
  username: {{ include "idp.pgUser" (list . "polaris") | quote }}
  password: {{ $password | quote }}
{{- end }}
