{{- if .Values.polaris.external.enabled }}
{{- $issuer := include "idp.issuer" . }}
# The official Apache Polaris chart has no bootstrap: this Job creates the realm and its root
# credentials once, straight in the database, before the Keycloak bootstrap.
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  labels:
    {{- include "idp.component" (list . "polaris-bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "idp.component" (list . "polaris-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "idp.pullSecrets" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ .Values.images.polarisAdminTool }}
          # Java directly: the image's run-java.sh logs its whole command line, the credential included.
          command: [java, -XX:MaxRAMPercentage=80.0, -jar, /deployments/polaris-admin-tool.jar]
          args: [bootstrap, --realm=POLARIS, "--credential=POLARIS,$(POLARIS_CLIENT_ID),$(POLARIS_CLIENT_SECRET)"]
          env:
            {{- include "idp.polarisEnv" . | nindent 12 }}
            - name: POLARIS_CLIENT_ID
              value: {{ .Values.polarisClientId | quote }}
            {{- include "idp.secretEnv" (list . "POLARIS_CLIENT_SECRET") | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
# Values for the official chart, computed from this release: install it with
#   kubectl get configmap iceberg-polaris-values -o jsonpath='{.data.values\.yaml}' > polaris-values.yaml
#   helm install catalog polaris/polaris --version 1.8.0 -f polaris-values.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: iceberg-polaris-values
  labels:
    {{- include "idp.labels" . | nindent 4 }}
data:
  values.yaml: |
    # Apache Polaris for the Iceberg Data Platform release {{ .Release.Name }} in {{ .Release.Namespace }}.
    # Generated by its chart; add your own settings (replicas, resources) in a second -f file.
    image:
      repository: {{ (split ":" .Values.images.polaris)._0 }}
      tag: {{ (split ":" .Values.images.polaris)._1 | quote }}
    {{- with .Values.imagePullSecrets }}
    # The official chart takes the Secrets' names only.
    imagePullSecrets:
      {{- range . }}
      - {{ .name }}
      {{- end }}
    {{- end }}
    # The platform's Services, NetworkPolicies and extensions find Polaris by these labels.
    podLabels:
      app.kubernetes.io/part-of: iceberg-data-platform
      app.kubernetes.io/component: polaris
      io.iceberg-platform.role: catalog
    realmContext:
      realms: [POLARIS]
    persistence:
      type: relational-jdbc
      relationalJdbc:
        additionalProperties:
          currentSchema: public
        secret:
          name: iceberg-polaris-db
          username: username
          password: password
          jdbcUrl: jdbcUrl
    storage:
      secret:
        name: {{ include "idp.secretName" . }}
        awsAccessKeyId: RUSTFS_ACCESS_KEY
        awsSecretAccessKey: RUSTFS_SECRET_KEY
    features:
      SUPPORTED_CATALOG_STORAGE_TYPES: [S3]
      ENABLE_SEMANTIC_MODELS: {{ .Values.polaris.semanticModels }}
      STORAGE_CREDENTIAL_DURATION_SECONDS: {{ .Values.polaris.tokenLifetime }}
      LIST_PAGINATION_ENABLED: true
    authentication:
      type: mixed
      tokenBroker:
        maxTokenGeneration: PT{{ .Values.polaris.tokenLifetime }}S
    oidc:
      authServeUrl: http://keycloak:8080/realms/iceberg
      client:
        id: polaris
      principalMapper:
        idClaimPath: polaris/principal_id
        nameClaimPath: polaris/principal_name
      principalRolesMapper:
        rolesClaimPath: polaris/roles
    advancedConfig:
      quarkus.oidc.token.issuer: {{ $issuer | quote }}
      quarkus.oidc.token.audience: polaris
      quarkus.oidc.jwks-path: http://keycloak:8080/realms/iceberg/protocol/openid-connect/certs
      quarkus.oidc.discovery-enabled: false
      quarkus.otel.sdk.disabled: true
    extraEnv:
      - name: AWS_REGION
        value: {{ .Values.awsRegion | quote }}
{{- end }}
