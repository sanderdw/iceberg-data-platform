{{- if .Values.ingress.enabled }}
{{- /* Each host routes only what browsers and laptop tools need, like the quick-share proxy. */ -}}
{{- $hosts := list -}}
{{- range $key := list "admin" "users" "auth" "catalog" "s3" }}{{ $hosts = append $hosts (include "idp.hostname" (list $ $key)) }}{{ end -}}
{{- /* Extension charts route and certify their own hosts. */ -}}
# Paths that must never be public go here: a Service without endpoints answers nothing.
apiVersion: v1
kind: Service
metadata:
  name: ingress-deny
  labels:
    {{- include "idp.labels" . | nindent 4 }}
spec:
  ports:
    - {name: http, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iceberg
  labels:
    {{- include "idp.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - secretName: {{ .Values.tls.secretName }}
      hosts:
        {{- toYaml $hosts | nindent 8 }}
  rules:
    - host: {{ include "idp.hostname" (list . "admin") }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: portal, port: {number: 3000}}}}
    - host: {{ include "idp.hostname" (list . "users") }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: users, port: {number: 3002}}}}
          - {path: /internal, pathType: Prefix, backend: {service: {name: ingress-deny, port: {number: 80}}}}
    # Sign-in only: the administration console and the master realm stay inside the cluster.
    - host: {{ include "idp.hostname" (list . "auth") }}
      http:
        paths:
          - {path: /realms/iceberg, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
          - {path: /resources, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
    # The Iceberg REST catalog only; the management API is never routed.
    - host: {{ include "idp.hostname" (list . "catalog") }}
      http:
        paths:
          - {path: /api/catalog, pathType: Prefix, backend: {service: {name: polaris, port: {number: 8181}}}}
    # The S3 API; RustFS's administration paths are not routed.
    - host: {{ include "idp.hostname" (list . "s3") }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: rustfs, port: {number: 9000}}}}
          - {path: /rustfs, pathType: Prefix, backend: {service: {name: ingress-deny, port: {number: 80}}}}
          - {path: /minio, pathType: Prefix, backend: {service: {name: ingress-deny, port: {number: 80}}}}
{{- end }}
