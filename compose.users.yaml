name: iceberg-workspaces

services:
  users:
    build:
      context: .
      dockerfile: user_portal/Dockerfile
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?Run scripts.setup first}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/iceberg
      OIDC_CLIENT_ID: iceberg-users
      OIDC_CLIENT_SECRET: ${OIDC_USERS_SECRET}
      OIDC_ORIGIN: ${USER_ORIGIN}
      USER_PORT: 3002
      USER_HOST: 0.0.0.0
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      USER_COOKIE_SECURE: ${USER_COOKIE_SECURE:-false}
      USER_STACK_NAME: iceberg-workspaces
      POLARIS_URL: http://polaris-control-plane:8181
      # Addresses a data share recipient connects to, as handed out with a new share.
      POLARIS_PUBLIC_URL: ${POLARIS_PUBLIC_URL:-http://localhost:8181}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_ADMIN_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      POLARIS_CONTAINER: iceberg-platform-polaris-1
      RUSTFS_CONTAINER: iceberg-platform-rustfs-1
      NOTEBOOK_IMAGE: iceberg-user-notebook:0.1.0
      MAX_NOTEBOOKS: ${MAX_NOTEBOOKS:-8}
      NOTEBOOK_MEMORY: ${NOTEBOOK_MEMORY:-1g}
    ports:
      - "127.0.0.1:${USER_PORT:-3002}:3002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - catalog
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:3002/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 45s

  # Build-only image used for isolated, on-demand per-user marimo containers.
  notebook-image:
    image: iceberg-user-notebook:0.1.0
    build:
      context: .
      dockerfile: user_portal/notebook/Dockerfile
    profiles: [images]

networks:
  catalog:
    external: true
    name: iceberg-platform_default
